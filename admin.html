<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowtym RH — Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/*
  Feuille de style dupliquée intentionnellement depuis index.html (variables, sidebar, kpis,
  tables, drawer, toast, login) plutôt qu'importée : ce fichier doit rester 100% indépendant
  de l'app hôtel (aucun risque de régression sur index.html, monolithe fragile). À maintenir
  manuellement en cohérence avec index.html si le design system évolue.
*/
:root{
  --violet:#8B5CF6;--violet-d:#7C3AED;--violet-bg:#ede9fe;
  --ink:#1e2330;--ink2:#5b6172;--muted:#9aa0ad;--line:#eceef3;--bg:#f6f7f9;--card:#fff;
  --green:#16a34a;--green-bg:#dcfce7;--red:#ef4444;--red-bg:#fee2e2;
  --amber:#d97706;--amber-bg:#fef3c7;--blue:#2563eb;--blue-bg:#dbeafe;
  --shadow:0 2px 8px rgba(0,0,0,.04);--shadow-h:0 12px 32px rgba(124,58,237,.14);--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit}
#root{min-height:100vh;display:flex;flex-direction:column}

/* ---- login ---- */
.login{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f6f7f9,#ede9fe)}
.lcard{background:#fff;border-radius:20px;padding:32px;width:380px;box-shadow:0 24px 60px rgba(20,20,40,.08)}
.lcard .mk{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-d));display:grid;place-items:center;color:#fff;font-size:18px;margin-bottom:18px}
.lcard h1{font-size:20px;font-weight:800;margin-bottom:4px}
.lcard .sub{color:var(--ink2);font-size:13px;margin-bottom:22px}
.fld{margin-bottom:13px}.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-bg)}
.fld textarea{resize:vertical;min-height:70px}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---- boutons ---- */
.btn{border:0;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn.p{background:var(--violet);color:#fff}.btn.p:hover{background:var(--violet-d)}
.btn.g{background:#f4f2fd;color:var(--violet-d)}.btn.g:hover{background:var(--violet-bg)}
.btn.d{background:var(--red-bg);color:var(--red)}.btn.d:hover{background:#fbcaca}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

/* ---- structure : topbar + sidebar + contenu ---- */
.main{flex:1;display:flex;min-height:0}
.top{background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.top-in{display:flex;align-items:center;gap:14px;padding:12px 22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--violet-d));display:grid;place-items:center;color:#fff;font-size:14px}
.logo small{color:var(--violet-d);font-weight:700;background:var(--violet-bg);padding:2px 7px;border-radius:6px;font-size:10.5px;margin-left:2px}
.searchbox{flex:1;max-width:420px;position:relative}
.searchbox i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.searchbox input{width:100%;padding:9px 13px 9px 34px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fafafe}
.searchbox input:focus{outline:none;border-color:var(--violet);background:#fff;box-shadow:0 0 0 3px var(--violet-bg)}
.spacer{flex:1}
.iconbtn{position:relative;width:36px;height:36px;border-radius:9px;border:0;background:#f4f4f6;color:var(--ink2);cursor:pointer;display:grid;place-items:center;font-size:14px}
.iconbtn:hover{background:var(--violet-bg);color:var(--violet-d)}
.popover{display:none;position:absolute;right:0;top:calc(100% + 8px);width:340px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.15);z-index:200;max-height:420px;overflow:auto}
.popover.on{display:block}
.popover .ph{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.popitem{padding:11px 16px;border-bottom:1px dashed var(--line);font-size:12.5px}
.popitem:last-child{border:0}
.popitem .a{font-weight:600}
.popitem .t{color:var(--muted);font-size:11px;margin-top:2px}
.meB{display:flex;align-items:center;gap:9px;border:0;background:transparent;cursor:pointer;padding:4px;border-radius:10px}
.meB:hover{background:#f4f4f6}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.meB .nm{text-align:left;font-size:12.5px}
.meB .nm b{display:block;font-weight:700;color:var(--ink)}
.meB .nm span{color:var(--muted);font-size:11px}

.sidebar{width:236px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.sidebar .menu{flex:1;padding:14px 10px;overflow-y:auto}
.navToggle{display:none}
.sidebarBackdrop{display:none}
.sidebar .menu .grp{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 6px}
.sidebar .menu .grp:first-child{padding-top:4px}
.sidebar .menu .it{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;cursor:pointer;font-size:13.5px;margin-bottom:2px;border:0;background:transparent;width:100%;text-align:left;font-family:inherit}
.sidebar .menu .it:hover{background:#f4f2fd;color:var(--violet-d)}
.sidebar .menu .it.on{background:var(--violet);color:#fff;font-weight:600}
.sidebar .menu .it .ic{width:20px;text-align:center;font-size:13px;flex-shrink:0}
.sidebar .menu .it .soon{margin-left:auto;font-size:9px;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:5px;font-weight:700}
.sidebar .menu .it.on .soon{background:rgba(255,255,255,.2);color:#fff}
.content{flex:1;overflow-y:auto;min-width:0}
.page{padding:22px 26px 60px}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.phead .sub{color:var(--ink2);font-size:13px}
.phead .actions{margin-left:auto;display:flex;gap:8px}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* ---- KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);transition:.15s}
.kpi:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:17px;margin-bottom:14px}
.kpi.v .ic{background:var(--violet-bg);color:var(--violet)}
.kpi.g .ic{background:var(--green-bg);color:var(--green)}
.kpi.b .ic{background:var(--blue-bg);color:var(--blue)}
.kpi.a .ic{background:var(--amber-bg);color:var(--amber)}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi .l{color:var(--ink2);font-size:13px;font-weight:600;margin-top:2px}
.kpi .sub{color:var(--muted);font-size:11.5px;margin-top:4px}

.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.cols2{grid-template-columns:1fr}}

/* ---- responsive : sidebar hors-écran + topbar compacte sous 768px ----
   Au-dessus de 768px (desktop + tablette, testé sur iPad 834px) la sidebar fixe de 236px
   reste inchangée. Sous 768px (mobile), elle devient un panneau superposé (comme le drawer
   existant), déclenché par un bouton hamburger, avec un fond semi-opaque pour la refermer. */
@media(max-width:768px){
  .navToggle{display:grid;place-items:center}
  .searchbox{display:none}
  #quickAddHotel .lbl{display:none}
  .top-in{padding:10px 14px;gap:8px}
  .meB .nm{display:none}
  .sidebar{
    position:fixed;top:0;left:0;height:100%;z-index:120;width:260px;max-width:82vw;
    transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow:12px 0 40px rgba(0,0,0,.18);
  }
  .sidebar.on{transform:none}
  .sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(14,16,28,.44);z-index:110}
  .sidebarBackdrop.on{display:block}
  .page{padding:16px 14px 50px}
  .kpis{grid-template-columns:1fr}
}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.box h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.box h3 i{color:var(--violet)}
.tlist{font-size:13px}
.tlist .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tlist .it:last-child{border:0}
.tlist .it .nm{font-weight:600}.tlist .it .sub{font-size:11.5px;color:var(--muted)}
.tlist .it .right{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink2);white-space:nowrap}

.tag{background:#f4f2fd;color:var(--violet-d);padding:3px 9px;border-radius:999px;font-weight:600;font-size:11px;display:inline-block;white-space:nowrap}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.gray{background:#f1f1f5;color:var(--ink2)}

.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
.tbl th{background:#fafafe;font-weight:700;color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
.tbl th:hover{color:var(--violet-d)}
.tbl th i{margin-left:4px;font-size:9px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafaff}
.tbl button{border:0;background:transparent;cursor:pointer;color:var(--violet);padding:4px 7px;border-radius:6px;font-size:13px}
.tbl button:hover{background:var(--violet-bg)}
.tbl .muted{color:var(--muted)}
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
.tblwrap .tbl{border:0;border-radius:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--violet)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:14px 4px;font-size:12.5px;color:var(--ink2)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:96vw;background:#fff;z-index:61;transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.14)}
.drawer.on{transform:none}
.dh{padding:22px 22px 16px;border-bottom:1px solid var(--line);position:relative}
.dh .close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;border:0;background:#f4f4f6;cursor:pointer;color:var(--ink2)}
.dh h2{font-size:19px;font-weight:800;padding-right:40px}
.dh .role{color:var(--ink2);font-size:13px;margin-top:4px}
.sec{padding:16px 22px;border-bottom:1px solid var(--line)}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:11px;font-weight:700}
.dfoot{padding:16px 22px;display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line)}
.hchip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:12.5px}

/* ---- modale confirmation ---- */
.modalbg{position:fixed;inset:0;background:rgba(14,16,28,.48);display:none;z-index:150;align-items:center;justify-content:center;padding:20px}
.modalbg.on{display:flex}
.modal{background:#fff;border-radius:18px;width:min(440px,94vw);box-shadow:0 32px 80px rgba(0,0,0,.22);padding:24px}
.modal.wide{width:min(720px,94vw);max-height:86vh;display:flex;flex-direction:column}
.modal h3{font-size:16px;font-weight:800;margin-bottom:8px}
.modal p{color:var(--ink2);font-size:13.5px;line-height:1.5;margin-bottom:18px}
.modal .mact{display:flex;gap:10px;justify-content:flex-end}
.modal .mscroll{overflow-y:auto;flex:1;margin:0 -4px 14px;padding:0 4px}
.modal .msummary{background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;margin-bottom:14px;line-height:1.5}
.modal .msummary.ok{background:var(--green-bg);color:var(--green)}
.modal .mwarn{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}

/* ---- accès refusé ---- */
.deny{height:100vh;display:grid;place-items:center}
.deny .card{text-align:center;max-width:380px;padding:20px}
.deny .ic{width:56px;height:56px;border-radius:16px;background:var(--red-bg);color:var(--red);display:grid;place-items:center;font-size:22px;margin:0 auto 16px}
.deny h1{font-size:18px;font-weight:800;margin-bottom:8px}
.deny p{color:var(--ink2);font-size:13.5px;margin-bottom:20px}

/* ---- stub phase 2 ---- */
.stub{background:#fff;border:1px solid var(--line);border-radius:18px;padding:60px 30px;text-align:center;max-width:520px;margin:40px auto}
.stub .ic{width:56px;height:56px;border-radius:16px;background:var(--violet-bg);color:var(--violet-d);display:grid;place-items:center;font-size:22px;margin:0 auto 18px}
.stub h2{font-size:18px;font-weight:800;margin-bottom:8px}
.stub p{color:var(--ink2);font-size:13.5px;line-height:1.6}
.stub .note{margin-top:16px;font-size:12px;color:var(--muted);background:#fafafe;border-radius:10px;padding:10px 14px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#15233b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}

/* ---- abonnements : tabs, fiche détaillée, formulaires modaux ---- */
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs .tab{border:0;background:none;padding:10px 4px;margin-right:18px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;position:relative;top:1px}
.tabs .tab.on{color:var(--violet-d);border-bottom:2px solid var(--violet)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--ink2)}
.actrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.applist{display:flex;flex-direction:column;gap:6px}
.appitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.appitem .right{display:flex;align-items:center;gap:8px}
.mform .fld{margin-bottom:13px}
.mform .fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.mform input,.mform select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}

/* ---- Export PDF (facture) : rendu navigateur, aucune librairie, aucun service externe ---- */
#invoicePrintArea{display:none}
@media print{
  body *{visibility:hidden}
  #invoicePrintArea, #invoicePrintArea *{visibility:visible}
  #invoicePrintArea{display:block;position:absolute;top:0;left:0;width:100%;padding:24px}
  .ip-h{display:flex;justify-content:space-between;margin-bottom:24px}
  .ip-h h1{font-size:20px}
  .ip-tbl{width:100%;border-collapse:collapse;margin-top:18px}
  .ip-tbl th,.ip-tbl td{border-bottom:1px solid #ccc;padding:8px;text-align:left;font-size:13px}
  .ip-tot{margin-top:14px;text-align:right;font-size:14px}
}
</style>
</head>
<body>
<div id="root"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="invoicePrintArea"></div>

<script>
/* =====================================================================
   Flowtym RH — Super Admin (/admin)
   Fichier statique indépendant (même approche que portal.html), sans build.
   Fonctionnel : Tableau de bord, Hôtels, Groupes hôteliers, Utilisateurs,
   Abonnements, Facturation, Audit, Paramètres plateforme, Supervision.
   Le reste du menu (Statistiques, Essais, Licences, Paiements, Support) est
   en préparation Phase 2+ : les tables existent déjà côté base mais sans RPC
   ni donnée réelle — pas d'UI mensongère.
   ===================================================================== */
const SUPABASE_URL = "https://hzrzkvdebaadditvbqis.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6cnprdmRlYmFhZGRpdHZicWlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjEwMTQsImV4cCI6MjA5MjY5NzAxNH0.IDFFWHNNIeBReWRTeVj8RlRpyz5J4XaStFhGVEYEBU8";

function showFatal(err){
  console.error(err);
  const r=document.getElementById('root');
  if(r) r.innerHTML=`<div style="max-width:640px;margin:60px auto;background:#fff;border:1px solid #eceef3;border-radius:16px;padding:28px;font-family:Inter,sans-serif">
    <h2 style="color:#b23b3b;margin-bottom:8px">Erreur de chargement</h2>
    <p style="color:#5b6172;margin-bottom:10px">${(err&&err.message)||err}</p></div>`;
}
window.addEventListener('error',e=>showFatal(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showFatal(e.reason));

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let sb=null, me=null, session=null, view=(location.hash.slice(1))||'dashboard';

/* =====================================================================
   Helpers purs (mirror exact de tests/lib/adminHelpers.js — garder synchronisés)
   ===================================================================== */
const HOTEL_STATUS_LABEL={draft:'Brouillon',active:'Actif',suspended:'Suspendu',archived:'Archivé'};
const HOTEL_STATUS_CLASS={draft:'gray',active:'green',suspended:'red',archived:'gray'};
function hotelStatusBadge(status){
  return {label:HOTEL_STATUS_LABEL[status]||status||'—', cls:HOTEL_STATUS_CLASS[status]||'gray'};
}
const SUB_STATUS_LABEL={trial:'Essai',active:'Actif',suspended:'Suspendu',expired:'Expiré',cancelled:'Résilié'};
const SUB_STATUS_CLASS={trial:'amber',active:'green',suspended:'red',expired:'gray',cancelled:'gray'};
function subscriptionStatusBadge(status){
  return {label:SUB_STATUS_LABEL[status]||status||'—', cls:SUB_STATUS_CLASS[status]||'gray'};
}
function trialDaysRemaining(dateStr, nowMs){
  if(!dateStr) return null;
  const now = nowMs || Date.now();
  const end = new Date(dateStr).getTime();
  if(Number.isNaN(end)) return null;
  return Math.ceil((end-now)/86400000);
}
function fmtMoney(n, cur){
  const v = Number(n||0);
  return v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' '+(cur==='EUR'||!cur?'€':cur);
}
function fmtNum(n){ return Number(n||0).toLocaleString('fr-FR'); }
function groupNameOr(name){ return (name&&name.trim())?name:'(sans nom)'; }
function fmtDate(s){
  if(!s) return '—';
  const d=new Date(s);
  if(Number.isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(s){
  if(!s) return '—';
  const d=new Date(s);
  if(Number.isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function avColor(seed){
  const colors=['#8B5CF6','#2563eb','#16a34a','#d97706','#dc2626','#0891b2'];
  let h=0; for(const c of String(seed||'')) h=(h*31+c.charCodeAt(0))>>>0;
  return colors[h%colors.length];
}
function initials(name){
  const parts=String(name||'?').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0]+(parts[1]?.[0]||'')).toUpperCase();
}
function errorLabel(msg){
  const map={
    NOM_VIDE:'Le nom est requis.',
    CODE_EXISTANT:'Ce code hôtel existe déjà.',
    HOTEL_INTROUVABLE:'Hôtel introuvable.',
    GROUPE_INTROUVABLE:'Groupe introuvable.',
    STATUT_INVALIDE:'Statut invalide.',
  };
  const key=String(msg||'').split(' ')[0].replace(/:$/,'');
  if(map[key]) return map[key];
  if(String(msg||'').startsWith('GROUPE_NON_VIDE')) return String(msg).replace('GROUPE_NON_VIDE :','').trim();
  return msg||'Une erreur est survenue.';
}
function toCSV(rows, cols){
  const esc2=v=>{const s=String(v??''); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const head=cols.map(c=>esc2(c.label)).join(';');
  const body=rows.map(r=>cols.map(c=>esc2(c.get(r))).join(';')).join('\n');
  return head+'\n'+body;
}
function downloadCSV(filename, rows, cols){
  const csv='﻿'+toCSV(rows,cols);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function sortRows(rows, key, dir){
  return [...rows].sort((a,b)=>{
    const av=a[key], bv=b[key];
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    if(av>bv) return dir==='desc'?-1:1;
    if(av<bv) return dir==='desc'?1:-1;
    return 0;
  });
}
// Attache groupe/abonnement/plan/nombre d'utilisateurs à chaque hôtel — pure, sans appel réseau.
function buildHotelRows(hotels, groups, subs, plans, users){
  const groupById=Object.fromEntries((groups||[]).map(g=>[g.id,g]));
  const planById=Object.fromEntries((plans||[]).map(p=>[p.id,p]));
  const subByHotel=Object.fromEntries((subs||[]).map(s=>[s.hotel_id,s]));
  return (hotels||[]).map(h=>({
    ...h, _group:groupById[h.group_id]||null, _sub:subByHotel[h.id]||null,
    _plan:subByHotel[h.id]?planById[subByHotel[h.id].plan_id]:null,
    _userCount:(users||[]).filter(u=>u.hotel_id===h.id && u.is_active).length,
  }));
}
// Recherche insensible à la casse sur nom/raison sociale/ville/code/e-mail — chaîne vide = pas de filtre.
function filterHotelsBySearch(rows, query){
  const q=String(query||'').trim().toLowerCase();
  if(!q) return rows;
  return rows.filter(h=>[h.name,h.company,h.city,h.hotel_code,h.email].filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
}
// Pagination pure — recale la page demandée dans les bornes valides (0..pageCount-1).
function paginateRows(rows, page, pageSize){
  const pageCount=Math.max(1,Math.ceil(rows.length/pageSize));
  const safePage=Math.min(Math.max(0,page||0),pageCount-1);
  return { pageRows: rows.slice(safePage*pageSize,(safePage+1)*pageSize), pageCount, page: safePage };
}

// Détermine quelles actions de cycle de vie sont pertinentes pour un statut donné —

function actionsForStatus(status){
  const all={ extendTrial:false, convertTrial:false, activate:false, suspend:false, reactivate:false,
    renew:false, changePlan:false, scheduleCancel:false, revertCancel:false, cancelNow:false };
  if(status==='trial') return {...all, extendTrial:true, convertTrial:true, changePlan:true, scheduleCancel:true, cancelNow:true};

  if(status==='suspended') return {...all, reactivate:true, changePlan:true, cancelNow:true};
  if(status==='expired') return {...all, cancelNow:true};
  return all; // cancelled : aucune action, statut final
}

}

// Validation cliente miroir de admin_update_platform_setting (le backend est la source de
// vérité, ceci évite un aller-retour réseau pour une erreur de saisie évidente).
const SETTING_NUMERIC_KEYS=['mrr_target','arr_target','default_tva_rate','default_commitment',
  'max_trial_days','min_trial_days','max_trial_extensions','churn_alert_rate','trial_duration_days'];
function settingValueType(key){
  if(SETTING_NUMERIC_KEYS.includes(key)) return 'number';
  if(key==='dunning_days_before') return 'array';
  return 'string';
}
function validateSettingValue(key, rawValue){
  const type=settingValueType(key);
  if(type==='number'){
    const n=Number(rawValue);
    if(rawValue===''||rawValue==null||Number.isNaN(n)) return {valid:false, error:'Doit être un nombre.'};
    return {valid:true, value:n};
  }
  if(type==='array'){
    const parts=String(rawValue||'').split(',').map(s=>s.trim()).filter(Boolean).map(Number);
    if(!parts.length||parts.some(Number.isNaN)) return {valid:false, error:'Doit être une liste de nombres séparés par des virgules.'};
    return {valid:true, value:parts};
  }
  if(rawValue==null||String(rawValue).trim()===''){ return {valid:false, error:'Ne peut pas être vide.'}; }
  return {valid:true, value:String(rawValue)};
}

// Présentation lisible d'une valeur de payload d'audit — jamais un bloc JSON brut par défaut
// (le JSON brut reste disponible via un <details> replié, pour l'utilisateur avancé).
function formatPayloadValue(v){
  if(v===null||v===undefined) return '—';
  if(typeof v==='boolean') return v?'Oui':'Non';
  if(Array.isArray(v)) return v.length?v.map(x=>formatPayloadValue(x)).join(', '):'—';
  if(typeof v==='object') return JSON.stringify(v);
  return String(v);
}

async function boot(){
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true}});
  await checkAuthAndRender();
}
async function checkAuthAndRender(){
  const {data:sessData}=await sb.auth.getSession();
  session=sessData?.session||null;
  if(!session){ renderLogin(); return; }
  const {data:isAdmin,error}=await sb.rpc('is_platform_admin');
  if(error){ showFatal(error); return; }
  if(!isAdmin){ renderAccessDenied(); return; }
  const {data:meRow}=await sb.from('platform_admins').select('*').eq('auth_id',session.user.id).maybeSingle();
  me = meRow || {email:session.user.email, role:'super_admin', full_name:null};
  renderShell();
}

// Permet le retour/avance navigateur entre les vues du portail (ex. Dashboard -> Hôtels -> Retour),
// et fait en sorte qu'un rafraîchissement (F5) recharge la vue en cours plutôt que de revenir au Dashboard.
window.addEventListener('popstate',()=>{
  if(!$('nav')) return; // shell pas encore rendu (ex. écran de connexion)
  const v=location.hash.slice(1)||'dashboard';
  if(v===view) return;

});

// Libellé neutre par vue pour le message d'erreur de chargement de page — jamais le message
// technique brut (SQL/PostgREST) renvoyé par le backend, qui reste uniquement dans la console
// (cf. console.error ci-dessous). Ne concerne que l'échec de CHARGEMENT d'une page ; les erreurs
// d'action (formulaires, boutons) continuent de passer par errorLabel(), qui traduit déjà les
// codes métier connus et reste inchangé.
const VIEW_LOAD_ERROR_LABEL={
  dashboard:'le tableau de bord', hotels:'la liste des hôtels', groups:'la liste des groupes',
  users:'la liste des utilisateurs', subscriptions:'la liste des abonnements',
  billing:'la facturation', audit:"le journal d'audit", settings:'les paramètres',
  supervision:'la supervision', support:'le support',
};
async function renderView(){
  const el=$('view');
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  try{
    if(view==='dashboard') await renderDashboard(el);
    else if(view==='hotels') await renderHotels(el);
    else if(view==='groups') await renderGroups(el);
    else if(view==='users') await renderUsers(el);
    else if(view==='subscriptions') await renderSubscriptions(el);
    else if(view==='billing') await renderBilling(el);
    else if(view==='support') await renderSupport(el);
    else if(view==='audit') await renderAudit(el);
    else if(view==='settings') await renderSettings(el);
    else if(view==='supervision') await renderSupervision(el);
    else renderStub(el, view);
  }catch(e){
    console.error('[renderView]', view, e);
    const label=VIEW_LOAD_ERROR_LABEL[view]||'cette page';
    el.innerHTML=`<div class="page"><div class="box" style="color:var(--red)"><i class="fa-solid fa-triangle-exclamation"></i> Impossible de charger ${label}. Veuillez réessayer.</div></div>`;
  }
}

function renderStub(el, key){
  const info=STUB_INFO[key]||{ic:'fa-solid fa-hourglass-half',desc:''};
  const label=MENU.flatMap(([,items])=>items).find(([k])=>k===key)?.[1]||key;

    <p>Module en préparation — Phase 2.</p>
    ${info.desc?`<div class="note">${esc(info.desc)}</div>`:''}
  </div></div>`;
}

// Navigation transversale depuis une alerte : ouvre directement l'objet concerné, en
// conservant le contexte (recherche pré-remplie) quand un lien direct par identifiant
// n'existe pas encore pour ce type d'objet (abonnement).
function goToAlertEntity(alert){
  if(!alert) return;
  if(alert.entity_type==='hotel'){
    goView('hotels');
    setTimeout(async()=>{ const {data}=await sb.from('hotels').select('*').eq('id',alert.entity_id).maybeSingle(); if(data) openHotelDetailDrawer(data); }, 250);
  } else if(alert.entity_type==='platform_invoice'){
    goView('billing');
    setTimeout(()=>openInvoiceDrawer(alert.entity_id, {}, ()=>renderView()), 250);
  } else if(alert.entity_type==='user'){
    goView('users');
    setTimeout(async()=>{
      const [{data},{data:hotels},{data:groups}]=await Promise.all([
        sb.rpc('admin_list_user_access'),
        sb.from('hotels').select('id,name,status'),
        sb.from('hotel_groups').select('id,name,status'),
      ]);
      const row=(data||[]).find(u=>u.user_id===alert.entity_id);
      if(row) openUserDrawer(row, hotels||[], groups||[], ()=>renderView());
    }, 250);
  } else if(alert.entity_type==='hotel_subscription'){
    searchQuery=alert.hotel_name||'';
    goView('subscriptions');
  } else {
    goView('audit');
  }
}

let hotelsPage=0, hotelsSort={key:'name',dir:'asc'}, hotelsFilterStatus='', hotelsFilterGroup='', hotelsFilterPlan='', hotelsFilterSub='', hotelsFilterTrial='';
async function renderHotels(el){
  const [{data:hotels,error:hErr},{data:groups,error:gErr},{data:subs},{data:plans},{data:publicPlans},{data:users}]=await Promise.all([
    // hotels n'a pas de colonne updated_at (jamais créée par aucune migration, ni en
    // production) — ne jamais la réintroduire ici sans une migration dédiée (cf. sql/tests
    // hotelsRegression). .order('id') donne un ordre de base déterministe, indépendant du tri
    // choisi côté client (tri stable même en cas d'égalité sur la clé de tri active).
    sb.from('hotels').select('id,name,city,country,status,group_id,hotel_code,total_rooms,phone,email,siret,tva_number,company,stars,currency,timezone,address,zip,website,created_at').order('id'),
    sb.from('hotel_groups').select('id,name,status'),
    sb.from('hotel_subscriptions').select('hotel_id,status,trial_ends_at,plan_id'),
    sb.from('subscription_plans').select('id,name'),
    sb.from('subscription_plans').select('id,name,is_active').eq('plan_scope','public'),
    sb.from('users').select('id,hotel_id,is_active'),
  ]);
  if(hErr) throw hErr; if(gErr) throw gErr;

  let rows=buildHotelRows(hotels, groups, subs, plans, users);
  rows=filterHotelsBySearch(rows, searchQuery);
  if(hotelsFilterStatus) rows=rows.filter(h=>h.status===hotelsFilterStatus);
  if(hotelsFilterGroup) rows=rows.filter(h=>h.group_id===hotelsFilterGroup);
  if(hotelsFilterPlan) rows=rows.filter(h=>h._sub?.plan_id===hotelsFilterPlan);
  if(hotelsFilterSub) rows=rows.filter(h=>hotelsFilterSub==='none' ? !h._sub : h._sub?.status===hotelsFilterSub);
  if(hotelsFilterTrial==='ongoing') rows=rows.filter(h=>h._sub?.status==='trial');
  if(hotelsFilterTrial==='expiring7') rows=rows.filter(h=>{
    if(h._sub?.status!=='trial') return false;
    const d=trialDaysRemaining(h._sub.trial_ends_at);
    return d!=null && d>=0 && d<=7;
  });
  rows=sortRows(rows,hotelsSort.key,hotelsSort.dir);

  const pageSize=20;
  const {pageRows,pageCount,page}=paginateRows(rows,hotelsPage,pageSize);
  hotelsPage=page;

  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Hôtels</h1><div class="sub">${fmtNum(rows.length)} hôtel(s)</div></div>
      <div class="actions">
        <button class="btn g" id="exportHotels"><i class="fa-solid fa-download"></i> Exporter CSV</button>
        <button class="btn p" id="addHotel"><i class="fa-solid fa-plus"></i> Nouvel hôtel</button>
      </div>
    </div>

      <select id="fGroup"><option value="">Tous les groupes</option>${(groups||[]).filter(g=>g.status!=='archived').map(g=>`<option value="${g.id}" ${hotelsFilterGroup===g.id?'selected':''}>${esc(groupNameOr(g.name))}</option>`).join('')}</select>
      <select id="fPlan"><option value="">Tous les plans</option>${(plans||[]).map(p=>`<option value="${p.id}" ${hotelsFilterPlan===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <select id="fSub"><option value="">Tous les abonnements</option>${Object.entries(SUB_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${hotelsFilterSub===k?'selected':''}>${l}</option>`).join('')}<option value="none" ${hotelsFilterSub==='none'?'selected':''}>Sans abonnement</option></select>
      <select id="fTrial">
        <option value="">Tous les essais</option>
        <option value="ongoing" ${hotelsFilterTrial==='ongoing'?'selected':''}>Essais en cours</option>
        <option value="expiring7" ${hotelsFilterTrial==='expiring7'?'selected':''}>Expirant sous 7 jours</option>
      </select>
    </div>

      <thead><tr>
        <th data-k="name">Hôtel</th><th data-k="city">Ville</th><th data-k="_group">Groupe</th><th data-k="status">Statut</th>
        <th>Plan</th><th>Abonnement</th><th>Essai / échéance</th><th>Utilisateurs</th><th>Actions</th>

  el.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;

    renderHotels(el);
  });
  $('fStatus').onchange=e=>{ hotelsFilterStatus=e.target.value; hotelsPage=0; renderHotels(el); };
  $('fGroup').onchange=e=>{ hotelsFilterGroup=e.target.value; hotelsPage=0; renderHotels(el); };
  $('fPlan').onchange=e=>{ hotelsFilterPlan=e.target.value; hotelsPage=0; renderHotels(el); };
  $('fSub').onchange=e=>{ hotelsFilterSub=e.target.value; hotelsPage=0; renderHotels(el); };
  $('fTrial').onchange=e=>{ hotelsFilterTrial=e.target.value; hotelsPage=0; renderHotels(el); };
  $('hPrev').onclick=()=>{ hotelsPage--; renderHotels(el); };
  $('hNext').onclick=()=>{ hotelsPage++; renderHotels(el); };
  $('addHotel').onclick=()=>openHotelDrawer(null,groups,publicPlans);
  $('exportHotels').onclick=()=>downloadCSV('hotels.csv', rows, [
    {label:'Nom',get:r=>r.name},{label:'Ville',get:r=>r.city},{label:'Statut',get:r=>hotelStatusBadge(r.status).label},
    {label:'Groupe',get:r=>r._group?groupNameOr(r._group.name):''},{label:'Plan',get:r=>r._plan?.name||''},
    {label:'Abonnement',get:r=>r._sub?subscriptionStatusBadge(r._sub.status).label:'Aucun'},{label:'Chambres',get:r=>r.total_rooms},
    {label:'Code',get:r=>r.hotel_code},{label:'Email',get:r=>r.email},{label:'Téléphone',get:r=>r.phone},
  ]);
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openHotelDrawer(rows.find(r=>r.id===b.dataset.edit),groups,plans));
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openHotelDetailDrawer(rows.find(r=>r.id===b.dataset.open)));
}
function rowHotelHtml(h){
  const sb1=hotelStatusBadge(h.status);
  let subBadge='<span class="tag gray">Aucun</span>', trialCell='—';
  if(h._sub){
    const s=subscriptionStatusBadge(h._sub.status);
    subBadge=`<span class="tag ${s.cls}">${esc(s.label)}</span>`;
    if(h._sub.status==='trial'){
      const d=trialDaysRemaining(h._sub.trial_ends_at);
      if(h._sub.trial_ends_at==null) trialCell='<span class="tag amber">Date manquante</span>';
      else if(d<0) trialCell='<span class="tag red">Expiré</span>';
      else trialCell=`<span class="tag ${d<=7?'amber':'gray'}">${d} j</span>`;
    }
  }
  return `<tr>
    <td><b>${esc(h.name)}</b>${h.hotel_code?`<div class="muted" style="font-size:11.5px">${esc(h.hotel_code)}</div>`:''}</td>
    <td>${esc(h.city||'—')}</td>
    <td>${h._group?esc(groupNameOr(h._group.name)):'<span class="muted">Autonome</span>'}</td>
    <td><span class="tag ${sb1.cls}">${esc(sb1.label)}</span></td>
    <td>${h._plan?esc(h._plan.name):'<span class="muted">—</span>'}</td>
    <td>${subBadge}</td>
    <td>${trialCell}</td>
    <td>${h._userCount}</td>
    <td>
      <button data-open="${h.id}" title="Ouvrir la fiche"><i class="fa-regular fa-eye"></i></button>
      <button data-edit="${h.id}" title="Modifier"><i class="fa-regular fa-pen-to-square"></i></button>
    </td>
  </tr>`;
}
function openHotelDrawer(hotel, groupsCache, plansCache){
  const groups = groupsCache || [];
  const plans = (plansCache || []).filter(p=>p.is_active !== false);
  const isEdit = !!hotel;
  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${isEdit?'Modifier l\'hôtel':'Nouvel hôtel'}</h2>
      ${isEdit?`<div class="role">Statut actuel : <span class="tag ${hotelStatusBadge(hotel.status).cls}">${esc(hotelStatusBadge(hotel.status).label)}</span></div>`:''}
    </div>
    <div class="sec"><h4>Identité</h4>
      <div class="fld"><label>Nom commercial *</label><input id="f_name" value="${esc(hotel?.name||'')}"></div>
      <div class="row2">
        <div class="fld"><label>Groupe</label><select id="f_group"><option value="">Aucun (hôtel autonome)</option>${groups.filter(g=>g.status!=='archived').map(g=>`<option value="${g.id}" ${hotel?.group_id===g.id?'selected':''}>${esc(groupNameOr(g.name))}</option>`).join('')}</select></div>
        <div class="fld"><label>Code hôtel</label><input id="f_code" value="${esc(hotel?.hotel_code||'')}" placeholder="Auto si vide (5 car. max)" maxlength="5" ${isEdit?'disabled title="Le code hôtel ne se modifie pas après création."':''}></div>
      </div>
    </div>
    <div class="sec"><h4>Coordonnées</h4>
      <div class="fld"><label>Adresse</label><input id="f_address" value="${esc(hotel?.address||'')}"></div>
      <div class="row2">
        <div class="fld"><label>Ville</label><input id="f_city" value="${esc(hotel?.city||'')}"></div>
        <div class="fld"><label>Code postal</label><input id="f_zip" value="${esc(hotel?.zip||'')}"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Pays</label><input id="f_country" value="${esc(hotel?.country||'France')}"></div>
        <div class="fld"><label>Fuseau horaire</label><input id="f_timezone" value="${esc(hotel?.timezone||'Europe/Paris')}"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Téléphone</label><input id="f_phone" value="${esc(hotel?.phone||'')}"></div>
        <div class="fld"><label>Email</label><input id="f_email" type="email" value="${esc(hotel?.email||'')}"></div>
      </div>
      <div class="fld"><label>Site web</label><input id="f_website" value="${esc(hotel?.website||'')}"></div>
    </div>
    <div class="sec"><h4>Informations administratives</h4>
      <div class="row2">
        <div class="fld"><label>SIRET</label><input id="f_siret" value="${esc(hotel?.siret||'')}"></div>
        <div class="fld"><label>N° TVA</label><input id="f_tva" value="${esc(hotel?.tva_number||'')}"></div>
      </div>
      <div class="fld"><label>Raison sociale</label><input id="f_company" value="${esc(hotel?.company||'')}"></div>
      <div class="fld"><label>Email de facturation</label><input id="f_billing_email" type="email" placeholder="Si différent de l'email ci-dessus" value="${esc(hotel?.billing_email||'')}"></div>
      <div class="row2">
        <div class="fld"><label>Chambres</label><input id="f_rooms" type="number" min="0" value="${esc(hotel?.total_rooms??'')}"></div>
        <div class="fld"><label>Devise</label><input id="f_currency" value="${esc(hotel?.currency||'EUR')}"></div>
      </div>
    </div>
    ${!isEdit?`
    <div class="sec"><h4>Abonnement initial</h4>
      <div class="fld"><label>Plan *</label><select id="f_plan"><option value="">Choisir un plan…</option>${plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Statut de départ</label><select id="f_substatus"><option value="trial">Période d'essai</option><option value="active">Activation immédiate</option></select></div>
    </div>
    <div class="sec"><h4>Premier administrateur</h4>
      <div class="row2">
        <div class="fld"><label>Nom complet</label><input id="f_admin_name" placeholder="Optionnel"></div>
        <div class="fld"><label>E-mail</label><input id="f_admin_email" type="email" placeholder="Optionnel"></div>
      </div>
      <p class="muted" style="font-size:12px">L'invitation par e-mail n'est pas encore automatisée : ces informations sont consignées dans l'audit. Créez le compte utilisateur depuis Utilisateurs une fois la personne prête à se connecter.</p>
    </div>`:''}
    <div class="dfoot"><button class="btn g" id="dCancel">Annuler</button><button class="btn p" id="dSave">${isEdit?'Enregistrer':'Créer'}</button></div>
  `);
  $('dClose').onclick=closeDrawer; $('dCancel').onclick=closeDrawer;
  $('dSave').onclick=async()=>{
    const payload={
      name:$('f_name').value.trim(), group_id:$('f_group').value||'', hotel_code:$('f_code').value.trim(),
      address:$('f_address').value, city:$('f_city').value, zip:$('f_zip').value, country:$('f_country').value,
      phone:$('f_phone').value, email:$('f_email').value, website:$('f_website').value,
      siret:$('f_siret').value, tva_number:$('f_tva').value, company:$('f_company').value,
      billing_email:$('f_billing_email').value,
      total_rooms:$('f_rooms').value, currency:$('f_currency').value, timezone:$('f_timezone').value,
    };
    if(!payload.name){ flash('Le nom est requis.','e'); return; }
    $('dSave').disabled=true;
    try{
      if(isEdit){
        // Un seul appel atomique (admin_update_hotel_full) : les champs de l'hôtel et le
        // rattachement de groupe sont modifiés dans la même transaction SQL — soit les deux
        // réussissent, soit aucun n'est appliqué. Évite tout état partiel visible côté UI.
        const {error}=await sb.rpc('admin_update_hotel_full',{p_hotel:hotel.id,p:payload});
        if(error) throw error;
      } else {
        const planId=$('f_plan').value;
        if(!planId){ flash('Un plan est requis pour créer un hôtel.','e'); $('dSave').disabled=false; return; }
        // Une seule RPC atomique (hôtel + abonnement) : jamais d'hôtel orphelin sans abonnement
        // si l'étape d'abonnement échouait dans un second appel séparé.
        const {error}=await sb.rpc('admin_create_hotel_with_subscription',{
          p_hotel:payload, p_plan_id:planId, p_subscription_status:$('f_substatus').value,
          p_first_admin_email:$('f_admin_email').value.trim()||null, p_first_admin_name:$('f_admin_name').value.trim()||null,
        });
        if(error) throw error;
      }
      flash(isEdit?'Hôtel mis à jour.':'Hôtel créé.'); closeDrawer(); renderView();
    }catch(e){ flash(errorLabel(e.message),'e'); }
    finally{ $('dSave').disabled=false; }
  };
}

async function openHotelDetailDrawer(hotel){

  openDrawer(`<div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button><h2>Chargement…</h2></div>`);
  $('dClose').onclick=closeDrawer;
  const [{data:groups},{data:sub},{data:plan},{data:users},{data:apps},{data:logs},{data:hotelInvoices}]=await Promise.all([
    sb.from('hotel_groups').select('id,name,status'),
    sb.from('hotel_subscriptions').select('*').eq('hotel_id',hotel.id).maybeSingle(),
    Promise.resolve({data:null}),
    sb.from('users').select('id,full_name,email,role,is_active').eq('hotel_id',hotel.id),
    sb.from('user_app_access').select('app_id, platform_apps(name)').eq('hotel_id',hotel.id),

    sb.rpc('admin_list_platform_invoices'),
  ]);
  const invoicesForHotel=(hotelInvoices||[]).filter(i=>i.hotel_id===hotel.id).slice(0,5);

  const group=(groups||[]).find(g=>g.id===hotel.group_id);
  const activeApps=[...new Set((apps||[]).map(a=>a.platform_apps?.name).filter(Boolean))];
  const st=hotelStatusBadge(hotel.status);

  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${esc(hotel.name)}</h2>
      <div class="role"><span class="tag ${st.cls}">${esc(st.label)}</span>${hotel.hotel_code?' · '+esc(hotel.hotel_code):''}</div>

      <div class="kv"><span>Raison sociale</span><b>${esc(hotel.company||'—')}</b></div>
      <div class="kv"><span>Adresse</span><b>${esc([hotel.address,hotel.zip,hotel.city,hotel.country].filter(Boolean).join(', ')||'—')}</b></div>
      <div class="kv"><span>Téléphone</span><b>${esc(hotel.phone||'—')}</b></div>
      <div class="kv"><span>E-mail</span><b>${esc(hotel.email||'—')}</b></div>
      <div class="kv"><span>SIRET / TVA</span><b>${esc(hotel.siret||'—')} / ${esc(hotel.tva_number||'—')}</b></div>
      <div class="kv"><span>Créé le</span><b>${fmtDateTime(hotel.created_at)}</b></div>
      <div class="actrow">
        <button class="btn g" id="hEdit"><i class="fa-regular fa-pen-to-square"></i> Modifier</button>
        <button class="btn g" id="hCopyUrl"><i class="fa-regular fa-copy"></i> Copier l'URL du portail</button>

        ${a.canActivate?'<button class="btn g" id="hActivate"><i class="fa-solid fa-play"></i> Activer</button>':''}
        ${a.canSuspend?'<button class="btn g" id="hSuspend"><i class="fa-solid fa-pause"></i> Suspendre</button>':''}
        ${a.canArchive?'<button class="btn d" id="hArchive"><i class="fa-regular fa-box-archive"></i> Archiver</button>':''}
        ${a.canRestore?'<button class="btn g" id="hRestore"><i class="fa-solid fa-box-open"></i> Restaurer</button>':''}
        `; })()}

        <div class="actrow"><button class="btn g" id="hGotoSub"><i class="fa-regular fa-calendar-check"></i> Voir la fiche abonnement complète</button></div>

    <div class="sec"><h4>Utilisateurs</h4>
      <div class="tlist">
        ${(users||[]).length?(users||[]).map(u=>`<div class="it"><div><div class="nm">${esc(u.full_name)}</div><div class="sub">${esc(u.email)} · ${esc(u.role)}</div></div><div class="right"><span class="tag ${u.is_active?'green':'gray'}">${u.is_active?'Actif':'Désactivé'}</span></div></div>`).join(''):'<div class="empty" style="padding:14px">Aucun utilisateur.</div>'}

    <div class="sec"><h4>Audit</h4>
      <div class="tlist">
        ${(logs||[]).length?(logs||[]).map(l=>`<div class="it"><div><div class="nm">${esc(l.action)}</div><div class="sub">${esc(l.admin_email||'—')}</div></div><div class="right">${fmtDateTime(l.created_at)}</div></div>`).join(''):'<div class="empty" style="padding:14px">Aucun événement.</div>'}
      </div>
    </div>
  `);
  $('dClose').onclick=closeDrawer;

  $('hCopyUrl').onclick=()=>{
    const url=`${location.origin}/?hotel=${hotel.hotel_code||hotel.id}`;
    navigator.clipboard?.writeText(url).then(()=>flash('URL copiée.')).catch(()=>flash('Copie impossible.','e'));

    const {error}=await sb.rpc('admin_set_hotel_status',{p_hotel:hotel.id,p_status:'active'}); if(error) throw error; flash('Hôtel activé.'); await refresh();
  }}));
  $('hSuspend')&&($('hSuspend').onclick=()=>confirmAction({title:'Suspendre l\'hôtel',danger:true,body:'L\'hôtel est marqué suspendu. Réversible à tout moment.',confirmLabel:'Suspendre',onConfirm:async()=>{
    const {error}=await sb.rpc('admin_set_hotel_status',{p_hotel:hotel.id,p_status:'suspended'}); if(error) throw error; flash('Hôtel suspendu.'); await refresh();
  }}));
  $('hArchive')&&($('hArchive').onclick=()=>confirmAction({title:'Archiver l\'hôtel',danger:true,body:'Action réversible (restauration possible). L\'abonnement et l\'historique sont conservés.',confirmLabel:'Archiver',onConfirm:async()=>{
    const {error}=await sb.rpc('admin_set_hotel_status',{p_hotel:hotel.id,p_status:'archived'}); if(error) throw error; flash('Hôtel archivé.'); await refresh();
  }}));
  $('hRestore')&&($('hRestore').onclick=()=>confirmAction({title:'Restaurer l\'hôtel',body:'L\'hôtel redevient actif.',confirmLabel:'Restaurer',onConfirm:async()=>{
    const {error}=await sb.rpc('admin_set_hotel_status',{p_hotel:hotel.id,p_status:'active'}); if(error) throw error; flash('Hôtel restauré.'); await refresh();
  }}));
  $('hGroupApply').onclick=()=>{

  $('hGotoSub')&&($('hGotoSub').onclick=()=>{ closeDrawer(); goView('subscriptions'); });
  $('hGotoUsers').onclick=()=>{ closeDrawer(); goView('users'); };
  $('hGotoBilling').onclick=()=>{ closeDrawer(); goView('billing'); };

/* =====================================================================
   Groupes hôteliers
   ===================================================================== */
async function renderGroups(el){
  const [{data:groups,error:gErr},{data:hotels},{data:subs},{data:users}]=await Promise.all([
    sb.from('hotel_groups').select('id,name,status,logo_url,created_at').order('created_at',{ascending:false}),
    sb.from('hotels').select('id,name,group_id'),
    sb.from('hotel_subscriptions').select('hotel_id,status'),
    sb.from('users').select('id,hotel_id,is_active'),
  ]);
  if(gErr) throw gErr;
  const withStats=g=>{
    const gHotels=(hotels||[]).filter(h=>h.group_id===g.id);
    const hotelIds=new Set(gHotels.map(h=>h.id));
    const activeSubs=(subs||[]).filter(s=>hotelIds.has(s.hotel_id) && ['trial','active'].includes(s.status)).length;
    const userCount=(users||[]).filter(u=>hotelIds.has(u.hotel_id) && u.is_active).length;
    return {...g, _hotels:gHotels, _activeSubs:activeSubs, _userCount:userCount};
  };
  let rows=(groups||[]).filter(g=>g.status!=='archived').map(withStats);
  const archived=(groups||[]).filter(g=>g.status==='archived').map(withStats);
  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    rows=rows.filter(g=>(g.name||'').toLowerCase().includes(q));
  }
  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Groupes hôteliers</h1><div class="sub">${fmtNum(rows.length)} groupe(s) actif(s) · ${fmtNum(archived.length)} archivé(s)</div></div>
      <div class="actions"><button class="btn p" id="addGroup"><i class="fa-solid fa-plus"></i> Nouveau groupe</button></div>
    </div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Groupe</th><th>Hôtels</th><th>Utilisateurs</th><th>Abonnements actifs</th><th>Statut</th><th>Créé le</th><th>Actions</th></tr></thead>
      <tbody>${rows.length?rows.map(g=>`
        <tr>
          <td><b>${esc(groupNameOr(g.name))}</b></td>
          <td>${g._hotels.length ? g._hotels.map(h=>esc(h.name)).join(', ') : '<span class="muted">Aucun</span>'}</td>
          <td>${g._userCount}</td>
          <td>${g._activeSubs}</td>
          <td><span class="tag ${g.status==='active'?'green':'gray'}">${g.status==='active'?'Actif':esc(g.status)}</span></td>
          <td>${fmtDate(g.created_at)}</td>
          <td>
            <button data-edit-group="${g.id}" title="Modifier"><i class="fa-regular fa-pen-to-square"></i></button>
            <button data-del-group="${g.id}" title="Archiver" ${g._hotels.length?'disabled':''}><i class="fa-regular fa-box-archive"></i></button>
          </td>
        </tr>`).join(''):'<tr><td colspan="7" class="empty">Aucun groupe.</td></tr>'}</tbody>
    </table></div>
    ${archived.length?`<h3 style="margin-top:18px;font-size:13px;color:var(--muted)">Groupes archivés</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Groupe</th><th>Archivé — hôtels rattachés</th><th>Actions</th></tr></thead>
      <tbody>${archived.map(g=>`<tr>
        <td>${esc(groupNameOr(g.name))}</td><td class="muted">${g._hotels.length} hôtel(s)</td>
        <td><button data-restore-group="${g.id}" title="Restaurer"><i class="fa-solid fa-box-open"></i></button></td>
      </tr>`).join('')}</tbody>
    </table></div>`:''}
  </div>`;
  $('addGroup').onclick=()=>openGroupDrawer(null, hotels||[]);
  el.querySelectorAll('[data-edit-group]').forEach(b=>b.onclick=()=>openGroupDrawer(rows.find(g=>g.id===b.dataset.editGroup), hotels||[]));
  el.querySelectorAll('[data-del-group]').forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>{
      const g=rows.find(x=>x.id===b.dataset.delGroup);
      confirmAction({
        title:`Archiver le groupe ${groupNameOr(g.name)}`,
        body:'Ce groupe sera archivé (suppression logique, jamais physique). Réversible via « Restaurer ».',
        confirmLabel:'Archiver', danger:true,
        onConfirm: async()=>{
          const {error}=await sb.rpc('admin_delete_group',{p_group:g.id});
          if(error) throw error;
          flash('Groupe archivé.'); renderGroups(el);
        }
      });
    };
  });
  el.querySelectorAll('[data-restore-group]').forEach(b=>b.onclick=()=>{
    const g=archived.find(x=>x.id===b.dataset.restoreGroup);
    confirmAction({
      title:`Restaurer le groupe ${groupNameOr(g.name)}`, body:'Le groupe redevient actif.', confirmLabel:'Restaurer',
      onConfirm: async()=>{
        const {error}=await sb.rpc('admin_restore_group',{p_group:g.id});
        if(error) throw error;
        flash('Groupe restauré.'); renderGroups(el);
      }
    });
  });
}
function openGroupDrawer(group, allHotels){
  const isEdit=!!group;
  const attached = isEdit ? allHotels.filter(h=>h.group_id===group.id) : [];
  const unattached = allHotels.filter(h=>!h.group_id || (isEdit && h.group_id!==group.id));
  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${isEdit?'Modifier le groupe':'Nouveau groupe'}</h2></div>
    <div class="sec"><h4>Identité</h4>
      <div class="fld"><label>Nom *</label><input id="g_name" value="${esc(group?.name||'')}"></div>
      <div class="fld"><label>Logo (URL)</label><input id="g_logo" value="${esc(group?.logo_url||'')}"></div>
    </div>
    <div class="dfoot"><button class="btn g" id="dCancel">Annuler</button><button class="btn p" id="dSave">${isEdit?'Enregistrer':'Créer'}</button></div>
    ${isEdit?`
    <div class="sec"><h4>Hôtels rattachés (${attached.length})</h4>
      ${attached.length?attached.map(h=>`<div class="hchip"><span>${esc(h.name)}</span><button class="btn sm d" data-detach="${h.id}">Détacher</button></div>`).join(''):'<div class="muted" style="font-size:12.5px">Aucun hôtel rattaché.</div>'}
    </div>
    <div class="sec"><h4>Rattacher un hôtel</h4>
      <div class="fld" style="display:flex;gap:8px">
        <select id="g_attach" style="flex:1">${unattached.length?unattached.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join(''):'<option value="">Aucun hôtel disponible</option>'}</select>
        <button class="btn g" id="g_attachBtn" ${!unattached.length?'disabled':''}>Rattacher</button>
      </div>
    </div>`:''}
  `);
  $('dClose').onclick=closeDrawer; $('dCancel').onclick=closeDrawer;
  $('dSave').onclick=async()=>{
    const name=$('g_name').value.trim();
    if(!name){ flash('Le nom est requis.','e'); return; }
    const payload={name, logo_url:$('g_logo').value};
    $('dSave').disabled=true;
    try{
      const {error}= isEdit
        ? await sb.rpc('admin_update_group',{p_group:group.id,p:payload})
        : await sb.rpc('admin_create_group',{p:payload});
      if(error) throw error;
      flash(isEdit?'Groupe mis à jour.':'Groupe créé.'); closeDrawer(); renderView();
    }catch(e){ flash(errorLabel(e.message),'e'); }
    finally{ $('dSave').disabled=false; }
  };
  if(isEdit){
    document.querySelectorAll('[data-detach]').forEach(b=>b.onclick=async()=>{
      const {error}=await sb.rpc('admin_detach_hotel_from_group',{p_hotel:b.dataset.detach});
      if(error){ flash(errorLabel(error.message),'e'); return; }
      flash('Hôtel détaché.'); closeDrawer(); renderView();
    });
    $('g_attachBtn')?.addEventListener('click',async()=>{
      const hotelId=$('g_attach').value;
      if(!hotelId) return;
      const {error}=await sb.rpc('admin_attach_hotel_to_group',{p_hotel:hotelId,p_group:group.id});
      if(error){ flash(errorLabel(error.message),'e'); return; }
      flash('Hôtel rattaché.'); closeDrawer(); renderView();
    });
  }
}

/* =====================================================================
   Utilisateurs et Accès (Lot 3)
   ===================================================================== */
let usersPage=0, usersSort={key:'_sortName',dir:'asc'};
let usersFilterStatus='', usersFilterRole='', usersFilterHotel='', usersFilterGroup='', usersFilterPending='', usersFilterSuper='';

async function renderUsers(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const [{data:rows,error:uErr},{data:unlinked,error:ulErr},{data:hotels},{data:groups}]=await Promise.all([
    sb.rpc('admin_list_user_access'),
    sb.rpc('admin_list_unlinked_auth_users'),
    sb.from('hotels').select('id,name,status,group_id'),
    sb.from('hotel_groups').select('id,name,status'),
  ]);
  if(uErr) throw uErr;
  const hotelById=Object.fromEntries((hotels||[]).map(h=>[h.id,h]));

  let list=(rows||[]).map(u=>{
    const groupIds=new Set((u.hotels||[]).map(h=>hotelById[h.hotel_id]?.group_id).filter(Boolean));
    return {...u,
      _status: accountStatus(u),
      _primaryRole: primaryRoleLabel(u),
      _sortName: (u.full_name||u.email||'').toLowerCase(),
      _groupIds: groupIds,
    };
  });

  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    list=list.filter(u=>[u.email,u.full_name,...(u.hotels||[]).map(h=>h.hotel_name),...(u.group_names||[])]
      .filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
  }
  if(usersFilterStatus) list=list.filter(u=>u._status===usersFilterStatus);
  if(usersFilterRole==='super_admin') list=list.filter(u=>u.is_super_admin);
  else if(usersFilterRole) list=list.filter(u=>(u.hotels||[]).some(h=>h.role===usersFilterRole));
  if(usersFilterHotel) list=list.filter(u=>(u.hotels||[]).some(h=>h.hotel_id===usersFilterHotel));
  if(usersFilterGroup) list=list.filter(u=>u._groupIds.has(usersFilterGroup));
  if(usersFilterPending==='yes') list=list.filter(u=>u._status==='pending_invite'||u._status==='expired_invite');
  if(usersFilterSuper==='yes') list=list.filter(u=>u.is_super_admin);
  list=sortRows(list, usersSort.key, usersSort.dir);

  const pageSize=20, pageCount=Math.max(1,Math.ceil(list.length/pageSize));
  usersPage=Math.min(usersPage,pageCount-1);
  const pageRows=list.slice(usersPage*pageSize,(usersPage+1)*pageSize);

  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Utilisateurs</h1><div class="sub">${fmtNum(list.length)} utilisateur(s) sur l'ensemble de la plateforme</div></div>
      <div class="actions">
        <button class="btn g" id="exportUsers"><i class="fa-solid fa-download"></i> Exporter CSV</button>
        <button class="btn p" id="inviteUserBtn"><i class="fa-solid fa-user-plus"></i> Inviter un utilisateur</button>
      </div>
    </div>
    <div class="filters">
      <select id="fUStatus"><option value="">Tous les statuts</option>${Object.entries(ACCOUNT_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${usersFilterStatus===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fURole"><option value="">Tous les rôles</option><option value="super_admin" ${usersFilterRole==='super_admin'?'selected':''}>Super Admin</option>${Object.entries(HOTEL_ROLE_LABEL).map(([k,l])=>`<option value="${k}" ${usersFilterRole===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fUHotel"><option value="">Tous les hôtels</option>${(hotels||[]).map(h=>`<option value="${h.id}" ${usersFilterHotel===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select>
      <select id="fUGroup"><option value="">Tous les groupes</option>${(groups||[]).filter(g=>g.status!=='archived').map(g=>`<option value="${g.id}" ${usersFilterGroup===g.id?'selected':''}>${esc(groupNameOr(g.name))}</option>`).join('')}</select>
      <select id="fUPending"><option value="">Invitation : tous</option><option value="yes" ${usersFilterPending==='yes'?'selected':''}>En attente uniquement</option></select>
      <select id="fUSuper"><option value="">Super Admin : tous</option><option value="yes" ${usersFilterSuper==='yes'?'selected':''}>Super Admin uniquement</option></select>
    </div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr>
        <th data-k="_sortName">Utilisateur</th><th>Email</th><th data-k="_status">Statut</th><th>Rôle principal</th>
        <th>Hôtels accessibles</th><th>Groupe</th><th data-k="last_login_at">Dernière connexion</th>
        <th data-k="invited_at">Invité le</th><th data-k="updated_at">Modifié le</th><th>Actions</th>
      </tr></thead>
      <tbody>${pageRows.length?pageRows.map(rowUserHtml).join(''):`<tr><td colspan="10" class="empty">Aucun utilisateur${searchQuery?' pour cette recherche':''}.</td></tr>`}</tbody>
    </table></div>
    <div class="pager">
      <span>Page ${usersPage+1} / ${pageCount}</span>
      <button id="uPrev" ${usersPage===0?'disabled':''}>‹ Précédent</button>
      <button id="uNext" ${usersPage>=pageCount-1?'disabled':''}>Suivant ›</button>
    </div>
    ${!ulErr && unlinked?.length ? `
    <div class="box" style="margin-top:18px">
      <h3><i class="fa-solid fa-user-clock"></i> Comptes non liés (${unlinked.length})</h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">Comptes ayant créé un accès (auth) mais sans profil applicatif ni rôle plateforme associé — inscriptions incomplètes ou anciens comptes à réconcilier.</p>
      <div class="tlist">${unlinked.map(a=>`<div class="it"><div><div class="nm">${esc(a.email)}</div><div class="sub">Créé le ${fmtDate(a.created_at)}</div></div><div class="right">Dernière connexion : ${fmtDateTime(a.last_sign_in_at)}</div></div>`).join('')}</div>
    </div>`:''}
  </div>`;

  el.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    usersSort = usersSort.key===k ? {key:k,dir:usersSort.dir==='asc'?'desc':'asc'} : {key:k,dir:'asc'};
    renderUsers(el);
  });
  $('fUStatus').onchange=e=>{ usersFilterStatus=e.target.value; usersPage=0; renderUsers(el); };
  $('fURole').onchange=e=>{ usersFilterRole=e.target.value; usersPage=0; renderUsers(el); };
  $('fUHotel').onchange=e=>{ usersFilterHotel=e.target.value; usersPage=0; renderUsers(el); };
  $('fUGroup').onchange=e=>{ usersFilterGroup=e.target.value; usersPage=0; renderUsers(el); };
  $('fUPending').onchange=e=>{ usersFilterPending=e.target.value; usersPage=0; renderUsers(el); };
  $('fUSuper').onchange=e=>{ usersFilterSuper=e.target.value; usersPage=0; renderUsers(el); };
  $('uPrev')&&($('uPrev').onclick=()=>{ usersPage--; renderUsers(el); });
  $('uNext')&&($('uNext').onclick=()=>{ usersPage++; renderUsers(el); });
  $('exportUsers').onclick=()=>downloadCSV('utilisateurs.csv', list, [
    {label:'Nom',get:r=>r.full_name||''},{label:'Email',get:r=>r.email},
    {label:'Statut',get:r=>accountStatusBadge(r._status).label},{label:'Rôle principal',get:r=>r._primaryRole},
    {label:'Hôtels',get:r=>(r.hotels||[]).map(h=>h.hotel_name).join(', ')},
    {label:'Groupe',get:r=>(r.group_names||[]).join(', ')},
    {label:'Invité le',get:r=>fmtDateTime(r.invited_at)},{label:'Modifié le',get:r=>fmtDateTime(r.updated_at)},
  ]);
  $('inviteUserBtn').onclick=()=>openInviteUserModal(hotels||[], ()=>renderUsers(el));
  el.querySelectorAll('[data-open-user]').forEach(b=>b.onclick=()=>{
    const row=list.find(u=>(u.user_id||('pa:'+u.auth_id))===b.dataset.openUser);
    openUserDrawer(row, hotels||[], groups||[], ()=>renderView());
  });
}

function rowUserHtml(u){
  const st=accountStatusBadge(u._status);
  const hotelTags=(u.hotels||[]).slice(0,3).map(h=>`<span class="tag ${h.is_default?'blue':'gray'}" title="${esc(hotelRoleLabel(h.role))}">${esc(h.hotel_name)}</span>`).join(' ');
  const hotelMore=(u.hotels||[]).length>3?` <span class="tag gray">+${(u.hotels||[]).length-3}</span>`:'';
  const groupTags=(u.group_names||[]).map(g=>`<span class="tag gray">${esc(groupNameOr(g))}</span>`).join(' ')||'<span class="muted">—</span>';
  const rowKey = u.user_id || ('pa:'+u.auth_id);
  return `<tr>
    <td>
      <div style="display:flex;align-items:center;gap:9px">
        <div class="av" style="width:28px;height:28px;font-size:10.5px;background:${avColor(u.email)}">${initials(u.full_name||u.email)}</div>
        <div><b>${esc(u.full_name||'(sans nom)')}</b>${u.is_super_admin?' <i class="fa-solid fa-shield-halved" style="color:var(--violet)" title="Super Admin"></i>':''}${u.is_platform_only?'<div class="muted" style="font-size:11px">Compte plateforme (sans profil hôtel)</div>':''}</div>
      </div>
    </td>
    <td>${esc(u.email)}</td>
    <td><span class="tag ${st.cls}">${esc(st.label)}</span></td>
    <td>${esc(u._primaryRole)}</td>
    <td>${hotelTags||'<span class="muted">Aucun</span>'}${hotelMore}</td>
    <td>${groupTags}</td>
    <td class="muted">${fmtDateTime(u.last_login_at)}</td>
    <td class="muted">${fmtDateTime(u.invited_at)}</td>
    <td class="muted">${fmtDateTime(u.updated_at)}</td>
    <td><button data-open-user="${rowKey}" title="Ouvrir la fiche"><i class="fa-regular fa-eye"></i></button></td>

}

/* ---- Invitation d'un utilisateur (via l'Edge Function invite-user, jamais de service_role côté client) ---- */
function openInviteUserModal(hotels, onDone){
  const activeHotels=(hotels||[]).filter(h=>h.status!=='archived');
  formModal({
    title:'Inviter un utilisateur',
    bodyHtml:`
      <div class="fld"><label>Hôtel *</label><select id="iv_hotel">${activeHotels.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Rôle *</label><select id="iv_role">${Object.entries(HOTEL_ROLE_LABEL).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="row2">
        <div class="fld"><label>Nom complet</label><input id="iv_name" placeholder="Optionnel"></div>
        <div class="fld"><label>E-mail *</label><input id="iv_email" type="email"></div>
      </div>
      <p class="muted" style="font-size:12px">En tant que Super Admin, vous pouvez inviter sur n'importe quel hôtel — y compris le premier administrateur d'un hôtel qui n'en a encore aucun.</p>
    `,
    confirmLabel:'Envoyer l\'invitation',
    onConfirm: async()=>{
      const hotel_id=$('iv_hotel').value, role=$('iv_role').value, full_name=$('iv_name').value.trim(), email=$('iv_email').value.trim();
      if(!email){ throw new Error('L\'e-mail est requis.'); }
      const {data,error}=await sb.functions.invoke('invite-user',{body:{email, full_name, role, hotel_id, access_type:'manager'}});
      if(error){ throw new Error(data?.error || error.message); }
      if(data?.error) throw new Error(data.error);
      flash(data?.already_existed ? 'Utilisateur existant : accès accordé et notifié.' : 'Invitation envoyée.');
      onDone && onDone();
    }
  });
}

/* ---- Fiche détaillée d'un utilisateur (5 sections) ---- */
async function openUserDrawer(row, allHotels, allGroups, onChange){
  if(!row){ flash('Utilisateur introuvable.','e'); return; }
  openDrawer(`<div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button><h2>Chargement…</h2></div>`);
  $('dClose').onclick=closeDrawer;

  if(row.is_platform_only){
    renderUserDrawerPlatformOnly(row, onChange);
    return;
  }
  const {data:detail,error}=await sb.rpc('admin_get_user_detail',{p_user_id:row.user_id});
  if(error){ flash(errorLabel(error.message),'e'); closeDrawer(); return; }
  renderUserDrawerBody(row, detail, allHotels, allGroups, onChange);
}

function renderUserDrawerPlatformOnly(row, onChange){
  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${esc(row.full_name||row.email)}</h2>
      <div class="role"><span class="tag blue">Super Admin</span> · Compte plateforme sans profil hôtel</div>

    <div class="sec"><h4>Identité</h4>

function renderUserDrawerBody(row, detail, allHotels, allGroups, onChange){
  const id=detail.identity, hotelAcc=detail.hotel_access||[], groupAcc=detail.group_access||[];
  const platform=detail.platform_role, history=detail.history||[];
  const status=accountStatusBadge(accountStatus({is_active:id.is_active, email_confirmed_at:id.email_confirmed_at, invited_at:id.invited_at}));
  const attachableHotels=(allHotels||[]).filter(h=>h.status!=='archived' && !hotelAcc.some(a=>a.hotel_id===h.id));
  const attachableGroups=(allGroups||[]).filter(g=>g.status!=='archived');

  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${esc(id.full_name||id.email)}</h2>
      <div class="role"><span class="tag ${status.cls}">${esc(status.label)}</span>${platform?` · <span class="tag blue">${esc(platformRoleLabel(platform.role))}</span>`:''}</div>
    </div>

    <div class="sec"><h4>A. Identité</h4>
      <div class="kv"><span>Email</span><b>${esc(id.email)}</b></div>
      <div class="kv"><span>Créé le</span><b>${fmtDateTime(id.created_at)}</b></div>
      <div class="kv"><span>Invité le</span><b>${fmtDateTime(id.invited_at)}</b></div>
      <div class="kv"><span>Confirmé le</span><b>${id.accepted_at?fmtDateTime(id.accepted_at):'Pas encore confirmé'}</b></div>
      <div class="kv"><span>Dernière connexion</span><b>${fmtDateTime(id.last_login_at)}</b></div>
      <div class="kv"><span>Modifié le</span><b>${fmtDateTime(id.updated_at)}</b></div>
      <div class="actrow">
        ${id.is_active?'<button class="btn d" id="uDeactivate"><i class="fa-solid fa-user-slash"></i> Désactiver</button>':'<button class="btn g" id="uReactivate"><i class="fa-solid fa-user-check"></i> Réactiver</button>'}

// Actions sur un accès hôtel précis (retrait avec garde du dernier admin + changement de rôle) —
// factorisé pour être réutilisé par la fiche normale et pourrait l'être par la fiche plateforme.
function el_bindHotelAccessActions(row, hotelAcc, refresh){
  document.querySelectorAll('[data-revoke-hotel]').forEach(b=>b.onclick=()=>{
    const hotelId=b.dataset.revokeHotel;
    const h=hotelAcc.find(x=>x.hotel_id===hotelId);
    const others=hotelAcc.filter(x=>x.hotel_id!==hotelId).map(x=>x.hotel_name);
    confirmAction({
      title:`Retirer l'accès à ${h.hotel_name}`, danger:true,
      body: revokeHotelImpactMessage(h.hotel_name, others),
      confirmLabel:'Retirer',
      onConfirm: async()=>{
        const {error}=await sb.rpc('admin_revoke_hotel',{p_user_id:row.user_id,p_hotel_id:hotelId});
        if(error){
          if(isLastHotelAdminError(error.message)){
            closeDrawer();
            // Différé : confirmAction() referme modalbg juste après la résolution de onConfirm,
            // ce qui écraserait immédiatement une nouvelle modale ouverte de façon synchrone ici.
            setTimeout(()=>openReplacementNeededModal(row.user_id, hotelId, h.hotel_name, refresh), 0);
            return;
          }
          throw error;
        }
        flash('Accès retiré.'); refresh();
      }
    });
  });
  document.querySelectorAll('[data-apply-role]').forEach(b=>b.onclick=()=>{
    const hotelId=b.dataset.applyRole;
    const sel=document.querySelector(`[data-role-hotel="${hotelId}"]`);
    const role=sel.value;
    const h=hotelAcc.find(x=>x.hotel_id===hotelId);
    if(role===h.role) return;
    confirmAction({
      title:'Changer le rôle', body:`Nouveau rôle sur ${esc(h.hotel_name)} : ${esc(hotelRoleLabel(role))}.`, confirmLabel:'Appliquer',
      onConfirm: async()=>{ const {error}=await sb.rpc('admin_set_hotel_role',{p_user_id:row.user_id,p_hotel_id:hotelId,p_role:role}); if(error) throw error; flash('Rôle mis à jour.'); refresh(); }
    });
  });
}

function openReplacementNeededModal(userId, hotelId, hotelName, refresh){
  formModal({
    title:'Un remplaçant est requis',
    bodyHtml:`<p style="margin-bottom:12px">Ce retrait laisserait <b>${esc(hotelName)}</b> sans administrateur (direction ou administrateur hôtel). Choisissez un remplaçant pour cet hôtel — il recevra le rôle « Administrateur hôtel » avant le retrait.</p>
      <div class="fld"><label>ID utilisateur remplaçant (depuis la liste Utilisateurs)</label><input id="rp_user" placeholder="Copiez l'identifiant depuis une autre fiche"></div>`,
    confirmLabel:'Retirer avec remplacement', danger:true,
    onConfirm: async()=>{
      const replacementId=$('rp_user').value.trim();
      if(!replacementId){ throw new Error('Un remplaçant est requis.'); }
      const {error}=await sb.rpc('admin_revoke_hotel',{p_user_id:userId,p_hotel_id:hotelId,p_replacement_user_id:replacementId});
      if(error) throw error;
      flash('Accès retiré, remplaçant promu administrateur hôtel.'); refresh();
    }
  });
}

function openRevokePlatformAdminModal(authId, refresh){
  formModal({
    title:'Retirer le rôle Super Admin',
    bodyHtml:`<div class="fld"><label>Motif *</label><textarea id="rv_reason" placeholder="Obligatoire — consigné dans l'historique"></textarea></div>`,
    confirmLabel:'Retirer', danger:true,
    onConfirm: async()=>{
      const reason=$('rv_reason').value.trim();
      if(!reason){ throw new Error('Un motif est requis.'); }
      const {error}=await sb.rpc('admin_revoke_platform_admin',{p_auth_id:authId,p_reason:reason});
      if(error) throw error;
      flash('Rôle Super Admin retiré.'); refresh();
    }
  });
}

let subsTab='list', subsPage=0, subsSort={key:'_hotelName',dir:'asc'};

// Prévisualisation stricte (lecture seule, admin_preview_expired_trials_processing) avant tout
// clic sur "Traiter les essais expirés". Portée volontairement limitée à hotel_subscriptions
// (l'abonnement principal) — décision ADR-011 (plan de dépréciation de
// hotel_app_subscriptions) : aucune nouvelle logique métier ne doit raisonner sur cette table
// legacy. Le traitement réel (process_expired_subscription_trials, inchangé) continue lui de
// traiter aussi hotel_app_subscriptions — ce résidu de portée disparaîtra avec elle une fois le
// moteur legacy retiré (cf. ADR-011). Le bouton de confirmation reste désactivé tant que la
// prévisualisation n'est pas chargée, et si elle ne comporte aucune ligne.
function openExpiredTrialsPreviewModal(el){
  $('modal').className='modal wide';
  $('modal').innerHTML=`<h3>Traiter les essais expirés</h3>
    <div class="loading" style="padding:30px 0"><i class="fa-solid fa-circle-notch fa-spin"></i> Analyse des essais expirés…</div>
    <div class="mact"><button class="btn g" id="mCancel">Annuler</button><button class="btn d" id="mOk" disabled>Traiter maintenant</button></div>`;
  $('modalbg').classList.add('on');
  $('mCancel').onclick=()=>{ $('modalbg').classList.remove('on'); $('modal').className='modal'; };
  (async()=>{
    let rows=[];
    try{
      const {data,error}=await sb.rpc('admin_preview_expired_trials_processing');
      if(error) throw error;
      rows=data||[];
    }catch(e){
      $('modal').innerHTML=`<h3>Traiter les essais expirés</h3>
        <p>${esc(errorLabel(e.message))}</p>
        <div class="mact"><button class="btn g" id="mCancel">Fermer</button></div>`;
      $('mCancel').onclick=()=>{ $('modalbg').classList.remove('on'); $('modal').className='modal'; };
      return;
    }
    const hotelCount=new Set(rows.map(r=>r.hotel_id)).size;
    const summary=rows.length
      ? `<div class="msummary">Cette action va expirer :<br>
          • ${rows.length} abonnement${rows.length>1?'s':''} principal${rows.length>1?'aux':''}<br>
          • ${hotelCount} hôtel${hotelCount>1?'s':''} concerné${hotelCount>1?'s':''}</div>`
      : `<div class="msummary ok"><i class="fa-solid fa-circle-check"></i> Aucune action nécessaire — aucun essai n'a dépassé sa date d'échéance.</div>`;
    const detailRows=rows.map(r=>`<div class="it" style="align-items:flex-start">
        <div><div class="nm">${esc(r.hotel_name)} — Abonnement principal</div>
          <div class="sub">Échéance ${fmtDateTime(r.trial_ends_at)} · ${r.days_since_expiry>=1?Math.floor(r.days_since_expiry)+' j de retard':'expiré aujourd\'hui'}</div>
        </div>
        <div class="right"><span class="tag red">expired</span></div>
      </div>`).join('');
    const detail=rows.length?`<div class="mscroll">${detailRows}</div>`:'';
    $('modal').innerHTML=`<h3>Traiter les essais expirés</h3>
      ${summary}
      <p>Déclenchement manuel, consigné dans les journaux plateforme — ne modifie aucun essai dont la date n'est pas encore atteinte. Chaque ligne ci-dessous est recalculée et revalidée au moment du traitement (la prévisualisation n'est pas une garantie transactionnelle absolue).</p>
      ${detail}
      <div class="mact"><button class="btn g" id="mCancel">Annuler</button><button class="btn d" id="mOk" ${rows.length?'':'disabled'}>Traiter maintenant</button></div>`;
    $('mCancel').onclick=()=>{ $('modalbg').classList.remove('on'); $('modal').className='modal'; };
    $('mOk').onclick=async()=>{
      $('mOk').disabled=true; $('mCancel').disabled=true;
      try{
        const {data,error}=await sb.rpc('admin_run_expired_trials_processing');
        if(error) throw error;
        const r=(data&&data[0])||{processed_subscriptions:0,skipped_locked:0};
        flash(`Traitement effectué : ${r.processed_subscriptions} abonnement(s) principal(aux) traité(s)${r.skipped_locked?`, ${r.skipped_locked} ignoré(s) (en cours de traitement concurrent)`:''}.`);
        $('modalbg').classList.remove('on'); $('modal').className='modal';
        renderSubscriptions(el);
      }catch(e){
        flash(errorLabel(e.message),'e');
        $('mOk').disabled=false; $('mCancel').disabled=false;
      }
    };
  })();
}

async function renderSubscriptions(el){
