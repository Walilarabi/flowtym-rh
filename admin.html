async function renderSubscriptionsList(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const [{data:hotels,error:hErr},{data:groups},{data:plans},{data:subs,error:sErr}]=await Promise.all([
    sb.from('hotels').select('id,name,group_id,status'),
    sb.from('hotel_groups').select('id,name'),
    sb.from('subscription_plans').select('id,name,slug,is_active,archived_at'),
    sb.from('hotel_subscriptions').select('*'),
  ]);
  if(hErr) throw hErr; if(sErr) throw sErr;
  const groupById=Object.fromEntries((groups||[]).map(g=>[g.id,g]));
  const planById=Object.fromEntries((plans||[]).map(p=>[p.id,p]));
  const legacyPlan=(plans||[]).find(p=>p.slug==='legacy-pilot');
  const subscribedHotelIds=new Set((subs||[]).map(s=>s.hotel_id));
  const orphanHotels=(hotels||[]).filter(h=>h.status!=='archived' && !subscribedHotelIds.has(h.id));

  let rows=(subs||[]).map(s=>{
    const hotel=(hotels||[]).find(h=>h.id===s.hotel_id);
    const group=hotel?.group_id?groupById[hotel.group_id]:null;
    const plan=planById[s.plan_id];
    return {...s, _hotel:hotel, _hotelName:hotel?.name||'(hôtel introuvable)', _group:group, _plan:plan};
  });

  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    rows=rows.filter(r=>[r._hotelName, r._group?.name, r._plan?.name].filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
  }
  if(subsFilterGroup) rows=rows.filter(r=>r._hotel?.group_id===subsFilterGroup);
  if(subsFilterPlan) rows=rows.filter(r=>r.plan_id===subsFilterPlan);
  if(subsFilterStatus) rows=rows.filter(r=>r.status===subsFilterStatus);
  if(subsFilterTrial==='ongoing') rows=rows.filter(r=>r.status==='trial');
  if(subsFilterTrial==='expiring7') rows=rows.filter(r=>{
    if(r.status!=='trial') return false;
    const d=trialDaysRemaining(r.trial_ends_at);
    return d!=null && d>=0 && d<=7;
  });
  rows=sortRows(rows, subsSort.key, subsSort.dir);

  const pageSize=20, pageCount=Math.max(1,Math.ceil(rows.length/pageSize));
  subsPage=Math.min(subsPage,pageCount-1);
  const pageRows=rows.slice(subsPage*pageSize,(subsPage+1)*pageSize);

  el.innerHTML=`
    ${orphanHotels.length?`
    <div class="box" style="border-color:var(--amber);margin-bottom:16px">
      <h3><i class="fa-solid fa-triangle-exclamation" style="color:var(--amber)"></i> ${orphanHotels.length} hôtel(s) sans abonnement principal</h3>
      <p class="muted" style="font-size:13px;margin:4px 0 10px">Ces hôtels sont opérationnels mais n'ont aucune ligne d'abonnement — ils n'apparaissent dans aucun cycle de facturation. Régularisez-les via un accès interne (Legacy Pilot) en attendant une décision commerciale définitive, ou créez un abonnement commercial depuis leur fiche (vue Hôtels).</p>
      <div class="it" style="flex-wrap:wrap;gap:8px">${orphanHotels.map(h=>`
        <div class="tag gray" style="padding:6px 10px;display:flex;align-items:center;gap:8px">
          ${esc(h.name)}
          <button class="btn g" style="padding:2px 8px;font-size:12px" data-regularize="${h.id}">Régulariser (Legacy Pilot)</button>
        </div>`).join('')}
      </div>
    </div>` : ''}
    <div class="filters">
      <select id="fGroup"><option value="">Tous les groupes</option>${(groups||[]).map(g=>`<option value="${g.id}" ${subsFilterGroup===g.id?'selected':''}>${esc(groupNameOr(g.name))}</option>`).join('')}</select>
      <select id="fPlan"><option value="">Tous les plans</option>${(plans||[]).map(p=>`<option value="${p.id}" ${subsFilterPlan===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <select id="fStatus"><option value="">Tous les statuts</option>${Object.entries(SUB_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${subsFilterStatus===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fTrial">
        <option value="">Tous les essais</option>
        <option value="ongoing" ${subsFilterTrial==='ongoing'?'selected':''}>Essais en cours</option>
        <option value="expiring7" ${subsFilterTrial==='expiring7'?'selected':''}>Expirant sous 7 jours</option>
      </select>
    </div>
    ${!rows.length && !subsFilterGroup && !subsFilterPlan && !subsFilterStatus && !subsFilterTrial && !searchQuery.trim() ? `
    <div class="stub"><div class="ic"><i class="fa-regular fa-calendar-check"></i></div><h2>Aucun abonnement</h2>
      <p>Aucun hôtel n'a encore d'abonnement principal. Créez-en un depuis la fiche d'un hôtel (vue Hôtels) ou via l'action ci-dessous.</p>
    </div>` : `
    <div class="tblwrap"><table class="tbl">
      <thead><tr>
        <th data-k="_hotelName">Hôtel</th><th>Groupe</th><th data-k="status">Statut</th><th>Plan</th><th>Essai</th>
        <th data-k="updated_at">Dernière mise à jour</th><th>Attribution</th><th>Actions</th>
      </tr></thead>
      <tbody>${pageRows.length?pageRows.map(rowSubscriptionHtml).join(''):`<tr><td colspan="8" class="empty">Aucun résultat${searchQuery?' pour cette recherche':''}.</td></tr>`}</tbody>
    </table></div>
    <div class="pager">
      <span>Page ${subsPage+1} / ${pageCount}</span>
      <button id="sPrev" ${subsPage===0?'disabled':''}>‹ Précédent</button>
      <button id="sNext" ${subsPage>=pageCount-1?'disabled':''}>Suivant ›</button>
    </div>`}
  `;
  el.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    subsSort = subsSort.key===k ? {key:k,dir:subsSort.dir==='asc'?'desc':'asc'} : {key:k,dir:'asc'};
    renderSubscriptionsList(el);
  });
  $('fGroup').onchange=e=>{ subsFilterGroup=e.target.value; subsPage=0; renderSubscriptionsList(el); };
  $('fPlan').onchange=e=>{ subsFilterPlan=e.target.value; subsPage=0; renderSubscriptionsList(el); };
  $('fStatus').onchange=e=>{ subsFilterStatus=e.target.value; subsPage=0; renderSubscriptionsList(el); };
  $('fTrial').onchange=e=>{ subsFilterTrial=e.target.value; subsPage=0; renderSubscriptionsList(el); };
  $('sPrev')&&($('sPrev').onclick=()=>{ subsPage--; renderSubscriptionsList(el); });
  $('sNext')&&($('sNext').onclick=()=>{ subsPage++; renderSubscriptionsList(el); });
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSubscriptionDrawer(rows.find(r=>r.id===b.dataset.open)));
  el.querySelectorAll('[data-regularize]').forEach(b=>b.onclick=()=>{
    const hotel=orphanHotels.find(h=>h.id===b.dataset.regularize);
    if(!legacyPlan){ flash('Aucun plan interne « Legacy Pilot » n\'existe dans le catalogue. Créez-le depuis le Catalogue des offres avant de régulariser un hôtel.','e'); return; }
    formModal({ title:`Régulariser ${hotel.name} (Legacy Pilot)`, confirmLabel:'Régulariser', bodyHtml:`
      <p class="muted" style="font-size:13px">Crée un abonnement interne (hors catalogue commercial) pour cet hôtel, actif immédiatement, sans engagement de facturation. Cette action est tracée dans l'audit et exige une date de revue future.</p>
      <div class="fld"><label>Plan</label><input value="${esc(legacyPlan.name)}" disabled></div>
      <div class="fld"><label>Motif de régularisation *</label><input id="f_reason" placeholder="Ex : hôtel actif historique sans abonnement, régularisation décidée par le CTO"></div>
      <div class="fld"><label>Date de revue *</label><input id="f_review" type="date"></div>
      <div class="fld"><label>Justification tarifaire *</label><input id="f_price" placeholder="Ex : accès gratuit temporaire en attendant une décision commerciale"></div>
    `, onConfirm: async()=>{
      const reason=$('f_reason').value.trim(), review=$('f_review').value, price=$('f_price').value.trim();
      if(!reason||!review||!price){ throw new Error('Tous les champs sont requis.'); }
      const {error}=await sb.rpc('admin_regularize_legacy_subscription',{
        p_hotel_id:hotel.id, p_plan_id:legacyPlan.id, p_reason:reason,
        p_review_due_at:new Date(review).toISOString(), p_price_justification:price,
      });
      if(error) throw error;
      flash('Hôtel régularisé (Legacy Pilot).'); renderSubscriptionsList(el);
    }});
  });
}

function rowSubscriptionHtml(s){
  const st=subscriptionStatusBadge(s.status);
  const at=attributionTypeBadge(s.attribution_type);
  let trialCell='—';
  if(s.status==='trial'){
    const d=trialDaysRemaining(s.trial_ends_at);
    if(s.trial_ends_at==null) trialCell='<span class="tag amber">Date manquante</span>';
    else if(d<0) trialCell=`<span class="tag red">Expiré</span>`;
    else trialCell=`<span class="tag ${d<=7?'amber':'gray'}">${d} j restant(s)</span>`;
  }
  return `<tr>
    <td><b>${esc(s._hotelName)}</b></td>
    <td>${s._group?esc(groupNameOr(s._group.name)):'<span class="muted">—</span>'}</td>
    <td><span class="tag ${st.cls}">${esc(st.label)}</span></td>
    <td>${s._plan?esc(s._plan.name):'<span class="muted">Plan introuvable</span>'}</td>
    <td>${trialCell}</td>
    <td class="muted">${fmtDateTime(s.updated_at)}</td>
    <td><span class="tag ${at.cls}">${esc(at.label)}</span></td>
    <td><button data-open="${s.id}" title="Ouvrir la fiche"><i class="fa-regular fa-eye"></i></button></td>
  </tr>`;
}

/* ---- Fiche détaillée d'un abonnement ---- */
async function openSubscriptionDrawer(sub){
  if(!sub){ flash('Abonnement introuvable.','e'); return; }
  openDrawer(`<div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button><h2>Chargement…</h2></div>`);
  $('dClose').onclick=closeDrawer;

  const [{data:hotel},{data:plan},{data:allPlans},{data:events},{data:addons},{data:allAddons},{data:appAccess},{data:apps}]=await Promise.all([
    sb.from('hotels').select('id,name,group_id').eq('id',sub.hotel_id).maybeSingle(),
    sb.from('subscription_plans').select('*').eq('id',sub.plan_id).maybeSingle(),
    sb.from('subscription_plans').select('id,name,is_active,archived_at').eq('plan_scope','public').order('sort_order'),
    sb.from('hotel_subscription_events').select('*').eq('subscription_id',sub.id).order('created_at',{ascending:false}),
    sb.from('hotel_addon_subscriptions').select('*, add_ons(name,app_id)').eq('hotel_id',sub.hotel_id),
    sb.from('add_ons').select('id,name,app_id').eq('is_active',true),
    sb.from('user_app_access').select('user_id, app_id, users(email,is_active)').eq('hotel_id',sub.hotel_id),
    sb.from('platform_apps').select('id,code,name'),
  ]);
  const appById=Object.fromEntries((apps||[]).map(a=>[a.id,a]));
  const {data:planModules}=await sb.from('plan_modules').select('app_id').eq('plan_id',sub.plan_id).eq('is_active',true);
  const includedAppIds=new Set((planModules||[]).map(m=>m.app_id));

  renderSubscriptionDrawerBody({sub, hotel, plan, allPlans:allPlans||[], events:events||[], addons:addons||[],
    allAddons:allAddons||[], appAccess:appAccess||[], apps:apps||[], appById, includedAppIds});
}

function renderSubscriptionDrawerBody(ctx){
  const {sub, hotel, plan, allPlans, events, addons, allAddons, appAccess, apps, appById, includedAppIds}=ctx;
  const st=subscriptionStatusBadge(sub.status);
  const at=attributionTypeBadge(sub.attribution_type);
  const acts=actionsForStatus(sub.status);
  const trialDays=sub.status==='trial'?trialDaysRemaining(sub.trial_ends_at):null;

  const activeAddons=addons.filter(a=>a.status==='active');
  const inactiveAddons=addons.filter(a=>a.status!=='active');

  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${esc(hotel?.name||'Hôtel')}</h2>
      <div class="role"><span class="tag ${st.cls}">${esc(st.label)}</span> · <span class="tag ${at.cls}">${esc(at.label)}</span></div>
    </div>

    <div class="sec"><h4>Résumé</h4>
      <div class="kv"><span>Plan</span><b>${plan?esc(plan.name):'Plan introuvable'}</b></div>
      <div class="kv"><span>Prix net</span><b>${fmtMoney(sub.snapshot_price_net_ht, sub.snapshot_currency)} / ${sub.billing_cycle==='annual'?'an':'mois'}</b></div>
      <div class="kv"><span>Date de début</span><b>${fmtDate(sub.created_at)}</b></div>
      <div class="kv"><span>Prochain renouvellement</span><b>${fmtDate(sub.next_billing_date)}</b></div>
      <div class="kv"><span>Résiliation planifiée</span><b>${sub.scheduled_cancellation_at?fmtDateTime(sub.scheduled_cancellation_at):'—'}</b></div>
      <div class="kv"><span>Résilié le</span><b>${sub.cancelled_at?fmtDateTime(sub.cancelled_at):'—'}</b></div>
      <div class="actrow">
        ${acts.changePlan?'<button class="btn g" id="aChangePlan"><i class="fa-solid fa-arrows-turn-right"></i> Changer de plan</button>':''}
        ${acts.suspend?'<button class="btn g" id="aSuspend"><i class="fa-solid fa-pause"></i> Suspendre</button>':''}
        ${acts.reactivate?'<button class="btn g" id="aReactivate"><i class="fa-solid fa-play"></i> Réactiver</button>':''}
        ${acts.renew?'<button class="btn g" id="aRenew"><i class="fa-solid fa-rotate"></i> Renouveler</button>':''}
        ${acts.scheduleCancel?'<button class="btn g" id="aScheduleCancel"><i class="fa-regular fa-calendar-xmark"></i> Planifier une résiliation</button>':''}
        ${sub.scheduled_cancellation_at?'<button class="btn g" id="aRevertCancel"><i class="fa-solid fa-rotate-left"></i> Annuler la résiliation planifiée</button>':''}
        ${acts.cancelNow?'<button class="btn d" id="aCancelNow"><i class="fa-solid fa-ban"></i> Résilier immédiatement</button>':''}
      </div>
    </div>

    ${sub.status==='trial'?`
    <div class="sec"><h4>Essai</h4>
      <div class="kv"><span>Fin d'essai</span><b>${sub.trial_ends_at?fmtDateTime(sub.trial_ends_at):'Non renseignée'}</b></div>
      <div class="kv"><span>Jours restants</span><b>${sub.trial_ends_at?(trialDays<0?'Expiré':trialDays+' j'):'—'}</b></div>
      <div class="kv"><span>Prolongations déjà accordées</span><b>${sub.trial_extensions_count}</b></div>
      <div class="actrow">
        ${acts.extendTrial?'<button class="btn g" id="aExtendTrial"><i class="fa-regular fa-hourglass-half"></i> Prolonger l\'essai</button>':''}
        ${acts.convertTrial?'<button class="btn p" id="aConvertTrial"><i class="fa-solid fa-check"></i> Convertir en abonnement actif</button>':''}
      </div>
    </div>` : ''}

    <div class="sec"><h4>Applications</h4>
      <div class="applist">
        ${apps.map(a=>{
          const included=includedAppIds.has(a.id);
          const addonCovers=activeAddons.some(ad=>ad.add_ons?.app_id===a.id);
          const usersWithAccess=appAccess.filter(u=>u.app_id===a.id && u.users?.is_active).length;
          return `<div class="appitem">
            <div class="nm">${esc(a.name)}</div>
            <div class="right">
              ${included?'<span class="tag green">Incluse au plan</span>':addonCovers?'<span class="tag amber">Via option</span>':'<span class="tag gray">Non couverte</span>'}
              <span class="muted" style="font-size:11.5px">${usersWithAccess} accès utilisateur(s)</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="sec"><h4>Options (add-ons)</h4>
      <div class="applist">
        ${activeAddons.length?activeAddons.map(a=>{
          const ab=addonStatusBadge(a.status);
          return `<div class="appitem">
            <div class="nm">${esc(a.add_ons?.name||'Option')}<div class="muted" style="font-size:11.5px">Depuis ${fmtDate(a.started_at)}${a.expires_at?' · jusqu\'au '+fmtDate(a.expires_at):''}</div></div>
            <div class="right"><span class="tag ${ab.cls}">${esc(ab.label)}</span>
              <button data-detach="${a.id}" title="Retirer l'option"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>`;
        }).join(''):'<div class="empty" style="padding:14px">Aucune option active.</div>'}
      </div>
      <div class="actrow"><button class="btn g" id="aAttachAddon"><i class="fa-solid fa-plus"></i> Attribuer une option</button></div>
      ${inactiveAddons.length?`<div class="muted" style="font-size:11.5px;margin-top:8px">${inactiveAddons.length} option(s) retirée(s) précédemment — visible dans l'historique.</div>`:''}
    </div>

    <div class="sec"><h4>Accès aux applications</h4>
      <div class="muted" style="font-size:12.5px;margin-bottom:8px">
        Mode <b>observe</b> : calcule le droit théorique (plan + options + essai + statut) et le compare à l'accès réel, sans rien modifier.
        Mode <b>enforce</b> : appliquerait ce calcul aux accès réels — verrouillé tant que la normalisation Phase 2E n'est pas terminée (cf. ADR-010 §1).
      </div>
      <div id="accessResolution" class="muted" style="font-size:12.5px">Cliquez sur « Résoudre (observe) » pour afficher les droits calculés.</div>
      <div class="actrow">
        <select id="resolveUser" style="min-width:220px">
          <option value="">Choisir un utilisateur…</option>
          ${appAccess.length?[...new Map(appAccess.map(u=>[u.user_id,u])).values()].map(u=>`<option value="${u.user_id}">${esc(u.users?.email||u.user_id)}</option>`).join(''):''}
        </select>
        <select id="resolveApp">${apps.map(a=>`<option value="${esc(a.code)}">${esc(a.name)}</option>`).join('')}</select>
        <button class="btn g" id="aObserve">Résoudre (observe)</button>
        <button class="btn d" id="aEnforce" title="Verrouillé — cf. ADR-010 §1">Appliquer (enforce)</button>
      </div>
    </div>

    <div class="sec"><h4>Historique</h4>
      <div class="tlist">
        ${events.length?events.map(e=>`
          <div class="it"><div><div class="nm">${esc(eventTypeLabel(e.event_type))}${e.from_status||e.to_status?` <span class="muted">(${esc(e.from_status||'—')} → ${esc(e.to_status||'—')})</span>`:''}</div>
          <div class="sub">${esc(e.actor_email||(e.actor_type==='system'?'Système':'—'))}${e.reason?' · '+esc(e.reason):''}</div></div>
          <div class="right">${fmtDateTime(e.created_at)}</div></div>
        `).join(''):'<div class="empty" style="padding:14px">Aucun événement.</div>'}
      </div>
    </div>
  `);

  $('dClose').onclick=closeDrawer;
  const refresh=async()=>{
    const {data:freshSub}=await sb.from('hotel_subscriptions').select('*').eq('id',sub.id).maybeSingle();
    if(freshSub) openSubscriptionDrawer(freshSub); else closeDrawer();
    renderView();
  };

  $('aChangePlan') && ($('aChangePlan').onclick=()=>{
    const candidates=allPlans.filter(p=>p.id!==sub.plan_id && p.is_active && !p.archived_at);
    formModal({ title:'Changer de plan', confirmLabel:'Changer', bodyHtml:`
      <div class="fld"><label>Nouveau plan *</label><select id="f_newplan">${candidates.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Motif *</label><input id="f_reason" placeholder="Ex : montée en gamme demandée par le client"></div>
    `, onConfirm: async()=>{
      const planId=$('f_newplan').value, reason=$('f_reason').value.trim();
      if(!reason){ throw new Error('Un motif est requis.'); }
      const {error}=await sb.rpc('admin_change_subscription_plan',{p_subscription_id:sub.id,p_new_plan_id:planId,p_reason:reason});
      if(error) throw error;
      flash('Plan changé.'); await refresh();
    }});
  });
  $('aSuspend') && ($('aSuspend').onclick=()=>{
    formModal({ title:'Suspendre l\'abonnement', danger:true, confirmLabel:'Suspendre', bodyHtml:`
      <div class="fld"><label>Motif *</label><input id="f_reason" placeholder="Ex : impayé, demande client…"></div>
    `, onConfirm: async()=>{
      const reason=$('f_reason').value.trim();
      if(!reason) throw new Error('Un motif est requis.');
      const {error}=await sb.rpc('admin_suspend_subscription',{p_subscription_id:sub.id,p_reason:reason});
      if(error) throw error;
      flash('Abonnement suspendu.'); await refresh();
    }});
  });
  $('aReactivate') && ($('aReactivate').onclick=()=>{
    confirmAction({ title:'Réactiver l\'abonnement', body:'L\'hôtel retrouvera un accès actif.', confirmLabel:'Réactiver', onConfirm: async()=>{
      const {error}=await sb.rpc('admin_reactivate_subscription',{p_subscription_id:sub.id});
      if(error) throw error;
      flash('Abonnement réactivé.'); await refresh();
    }});
  });
  $('aRenew') && ($('aRenew').onclick=()=>{
    formModal({ title:'Renouveler l\'abonnement', confirmLabel:'Renouveler', bodyHtml:`
      <div class="fld"><label>Prochaine date de facturation *</label><input id="f_date" type="date"></div>
    `, onConfirm: async()=>{
      const date=$('f_date').value;
      if(!date) throw new Error('Une date est requise.');
      const {error}=await sb.rpc('admin_renew_subscription',{p_subscription_id:sub.id,p_next_billing_date:date});
      if(error) throw error;
      flash('Abonnement renouvelé.'); await refresh();
    }});
  });
  $('aScheduleCancel') && ($('aScheduleCancel').onclick=()=>{
    formModal({ title:'Planifier une résiliation', danger:true, confirmLabel:'Planifier', bodyHtml:`
      <div class="fld"><label>Date d'effet *</label><input id="f_date" type="datetime-local"></div>
      <div class="fld"><label>Motif *</label><input id="f_reason"></div>
    `, onConfirm: async()=>{
      const date=$('f_date').value, reason=$('f_reason').value.trim();
      if(!date || !reason) throw new Error('Date et motif sont requis.');
      const {error}=await sb.rpc('admin_schedule_subscription_cancellation',{p_subscription_id:sub.id,p_effective_at:new Date(date).toISOString(),p_reason:reason});
      if(error) throw error;
      flash('Résiliation planifiée.'); await refresh();
    }});
  });
  $('aRevertCancel') && ($('aRevertCancel').onclick=()=>{
    confirmAction({ title:'Annuler la résiliation planifiée', body:'L\'abonnement continuera normalement.', confirmLabel:'Annuler la résiliation', onConfirm: async()=>{
      const {error}=await sb.rpc('admin_revert_scheduled_cancellation',{p_subscription_id:sub.id});
      if(error) throw error;
      flash('Résiliation planifiée annulée.'); await refresh();
    }});
  });
  $('aCancelNow') && ($('aCancelNow').onclick=()=>{
    formModal({ title:'Résilier immédiatement', danger:true, confirmLabel:'Résilier', bodyHtml:`
      <div class="fld"><label>Motif *</label><input id="f_reason"></div>
      <p class="muted" style="font-size:12px">Action définitive. L'historique de l'abonnement est conservé (jamais supprimé).</p>
    `, onConfirm: async()=>{
      const reason=$('f_reason').value.trim();
      if(!reason) throw new Error('Un motif est requis.');
      const {error}=await sb.rpc('admin_cancel_subscription_immediate',{p_subscription_id:sub.id,p_reason:reason});
      if(error) throw error;
      flash('Abonnement résilié.'); await refresh();
    }});
  });
  $('aExtendTrial') && ($('aExtendTrial').onclick=()=>{
    formModal({ title:'Prolonger l\'essai', confirmLabel:'Prolonger', bodyHtml:`
      <div class="fld"><label>Nouvelle date de fin *</label><input id="f_date" type="date"></div>
      <div class="fld"><label>Motif</label><input id="f_reason"></div>
    `, onConfirm: async()=>{
      const date=$('f_date').value;
      if(!date) throw new Error('Une date est requise.');
      const {error}=await sb.rpc('admin_extend_trial',{p_subscription_id:sub.id,p_new_trial_ends_at:new Date(date).toISOString(),p_reason:$('f_reason').value.trim()||null});
      if(error) throw error;
      flash('Essai prolongé.'); await refresh();
    }});
  });
  $('aConvertTrial') && ($('aConvertTrial').onclick=()=>{
    confirmAction({ title:'Convertir en abonnement actif', body:'L\'essai se termine et l\'abonnement devient actif immédiatement.', confirmLabel:'Convertir', onConfirm: async()=>{
      const {error}=await sb.rpc('admin_convert_trial_to_active',{p_subscription_id:sub.id});
      if(error) throw error;
      flash('Essai converti en abonnement actif.'); await refresh();
    }});
  });
  $('aAttachAddon') && ($('aAttachAddon').onclick=()=>{
    const available=allAddons.filter(a=>!activeAddons.some(x=>x.addon_id===a.id));
    if(!available.length){ flash('Aucune option disponible à attribuer.','w'); return; }
    formModal({ title:'Attribuer une option', confirmLabel:'Attribuer', bodyHtml:`
      <div class="fld"><label>Option *</label><select id="f_addon">${available.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Motif</label><input id="f_reason"></div>
    `, onConfirm: async()=>{
      const {error}=await sb.rpc('admin_attach_addon',{p_hotel_id:sub.hotel_id,p_addon_id:$('f_addon').value,p_reason:$('f_reason').value.trim()||null});
      if(error) throw error;
      flash('Option attribuée.'); await refresh();
    }});
  });
  document.querySelectorAll('[data-detach]').forEach(b=>b.onclick=()=>{
    formModal({ title:'Retirer l\'option', danger:true, confirmLabel:'Retirer', bodyHtml:`<div class="fld"><label>Motif *</label><input id="f_reason"></div>`,
      onConfirm: async()=>{
        const reason=$('f_reason').value.trim();
        if(!reason) throw new Error('Un motif est requis.');
        const {error}=await sb.rpc('admin_detach_addon',{p_hotel_addon_subscription_id:b.dataset.detach,p_reason:reason});
        if(error) throw error;
        flash('Option retirée.'); await refresh();
      }});
  });
  $('aObserve') && ($('aObserve').onclick=async()=>{
    const userId=$('resolveUser').value, appCode=$('resolveApp').value;
    if(!userId){ flash('Choisissez un utilisateur.','w'); return; }
    const {data,error}=await sb.rpc('admin_resolve_app_access',{p_user_id:userId,p_hotel_id:sub.hotel_id,p_app_code:appCode,p_mode:'observe'});
    if(error){ flash(errorLabel(error.message),'e'); return; }
    const causes=(data.causes||[]).map(c=>`<span class="tag amber">${esc(causeLabel(c))}</span>`).join(' ');
    $('accessResolution').innerHTML=`
      <div class="kv"><span>Droit théorique</span><b>${data.theoretical_access?'Accordé':'Refusé'}</b></div>
      <div class="kv"><span>Accès effectif</span><b>${data.actual_access?'Accordé':'Refusé'}</b></div>
      <div class="kv"><span>Écart</span><b>${data.diverges?'Oui':'Non'}</b></div>
      ${causes?`<div style="margin-top:6px">${causes}</div>`:''}
    `;
  });
  $('aEnforce') && ($('aEnforce').onclick=async()=>{
    const userId=$('resolveUser').value, appCode=$('resolveApp').value;
    if(!userId){ flash('Choisissez un utilisateur.','w'); return; }
    confirmAction({ title:'Appliquer les droits (enforce)', danger:true,
      body:'Cette action tenterait de synchroniser l\'accès réel sur le droit théorique calculé. Le mode enforce est actuellement verrouillé côté serveur tant que la normalisation des abonnements (Phase 2E) n\'est pas terminée — cf. ADR-010 §1.',
      confirmLabel:'Tenter quand même', onConfirm: async()=>{
        const {error}=await sb.rpc('admin_resolve_app_access',{p_user_id:userId,p_hotel_id:sub.hotel_id,p_app_code:appCode,p_mode:'enforce'});
        if(error) throw error;
        flash('Droits appliqués.'); await refresh();
      }});

  const rows=(plans||[]).filter(p=>!p.archived_at || subsFilterStatus==='__show_archived__');

  el.innerHTML=`
    <div class="phead"><div class="sub">${fmtNum(rows.length)} plan(s) actif(s) ou inactif(s) · ${fmtNum(archived.length)} archivé(s)</div>
      <div class="actions"><button class="btn p" id="addPlan"><i class="fa-solid fa-plus"></i> Nouveau plan</button></div>

      <tbody>${rows.length?rows.map(rowPlanHtml).join(''):'<tr><td colspan="7" class="empty">Aucun plan.</td></tr>'}</tbody>
    </table></div>
    ${archived.length?`<h3 style="margin-top:18px;font-size:13px;color:var(--muted)">Plans archivés</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Plan</th><th>Archivé le</th><th>Motif</th><th>Actions</th></tr></thead>
      <tbody>${archived.map(p=>`<tr>

        <td><button data-unarchive="${p.id}" title="Désarchiver"><i class="fa-solid fa-box-open"></i></button></td>
      </tr>`).join('')}</tbody>
    </table></div>`:''}
  `;
  $('addPlan').onclick=()=>openPlanDrawer(null);
  el.querySelectorAll('[data-editplan]').forEach(b=>b.onclick=()=>openPlanDrawer(plans.find(p=>p.id===b.dataset.editplan)));

      body:nextActive?'Le plan redevient utilisable.':'Le plan ne sera plus commercialisable tant qu\'il est inactif.',
      danger:!nextActive, confirmLabel:'Confirmer', onConfirm: async()=>{
        const {error}=await sb.rpc('admin_set_plan_active',{p_plan_id:plan.id,p_is_active:nextActive});
        if(error) throw error;
        flash('Plan mis à jour.'); renderPlanCatalog(el);
      }});
  });
  el.querySelectorAll('[data-archiveplan]').forEach(b=>b.onclick=()=>{
    formModal({ title:'Archiver le plan', danger:true, confirmLabel:'Archiver', bodyHtml:`<div class="fld"><label>Motif *</label><input id="f_reason"></div>`,
      onConfirm: async()=>{
        const reason=$('f_reason').value.trim();
        if(!reason) throw new Error('Un motif est requis.');
        const {error}=await sb.rpc('admin_set_plan_archived',{p_plan_id:b.dataset.archiveplan,p_archived:true,p_reason:reason});
        if(error) throw error;
        flash('Plan archivé.'); renderPlanCatalog(el);
      }});
  });
  el.querySelectorAll('[data-unarchive]').forEach(b=>b.onclick=()=>{
    confirmAction({ title:'Désarchiver le plan', body:'Le plan redevient actif mais restera non commercialisable jusqu\'à revue.', confirmLabel:'Désarchiver', onConfirm: async()=>{
      const {error}=await sb.rpc('admin_set_plan_archived',{p_plan_id:b.dataset.unarchive,p_archived:false});
      if(error) throw error;
      flash('Plan désarchivé.'); renderPlanCatalog(el);

  });
  el.querySelectorAll('[data-modules]').forEach(b=>b.onclick=()=>openPlanModulesDrawer(plans.find(p=>p.id===b.dataset.modules)));

function openPlanDrawer(plan){
  const isEdit=!!plan;
  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button><h2>${isEdit?'Modifier le plan':'Nouveau plan'}</h2></div>
    <div class="sec">
      <div class="fld"><label>Nom *</label><input id="f_name" value="${esc(plan?.name||'')}"></div>
      ${!isEdit?`<div class="fld"><label>Slug *</label><input id="f_slug" placeholder="ex: flow-starter"></div>`:''}
      <div class="fld"><label>Description</label><input id="f_desc" value="${esc(plan?.description||'')}"></div>
      <div class="row2">
        <div class="fld"><label>Prix mensuel (€ HT)</label><input id="f_pm" type="number" step="0.01" value="${plan?.price_monthly??0}"></div>
        <div class="fld"><label>Prix annuel (€ HT)</label><input id="f_pa" type="number" step="0.01" value="${plan?.price_annual??0}"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Essai (jours)</label><input id="f_trial" type="number" value="${plan?.trial_days??14}"></div>
        <div class="fld"><label>Ordre d'affichage</label><input id="f_sort" type="number" value="${plan?.sort_order??0}"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Chambres max</label><input id="f_rooms" type="number" value="${plan?.max_rooms??''}"></div>
        <div class="fld"><label>Utilisateurs max</label><input id="f_users" type="number" value="${plan?.max_users??''}"></div>
      </div>
      <div class="fld"><label>Hôtels max</label><input id="f_hotels" type="number" value="${plan?.max_hotels??1}"></div>
    </div>
    <div class="dfoot"><button class="btn g" id="dCancel">Annuler</button><button class="btn p" id="dSave">${isEdit?'Enregistrer':'Créer'}</button></div>
  `);
  $('dClose').onclick=closeDrawer; $('dCancel').onclick=closeDrawer;
  $('dSave').onclick=async()=>{
    const name=$('f_name').value.trim();
    if(!name){ flash('Le nom est requis.','e'); return; }
    $('dSave').disabled=true;
    try{
      if(isEdit){
        const {error}=await sb.rpc('admin_update_plan',{
          p_plan_id:plan.id, p_name:name, p_description:$('f_desc').value||null,
          p_price_monthly:Number($('f_pm').value||0), p_price_annual:Number($('f_pa').value||0),
          p_trial_days:Number($('f_trial').value||14), p_max_rooms:$('f_rooms').value?Number($('f_rooms').value):null,
          p_max_users:$('f_users').value?Number($('f_users').value):null, p_max_hotels:Number($('f_hotels').value||1),
          p_sort_order:Number($('f_sort').value||0),
        });
        if(error) throw error;
      } else {
        const slug=$('f_slug').value.trim();
        if(!slug){ flash('Le slug est requis.','e'); $('dSave').disabled=false; return; }
        const {error}=await sb.rpc('admin_create_plan',{
          p_name:name, p_slug:slug, p_description:$('f_desc').value||null,
          p_price_monthly:Number($('f_pm').value||0), p_price_annual:Number($('f_pa').value||0),
          p_trial_days:Number($('f_trial').value||14), p_max_rooms:$('f_rooms').value?Number($('f_rooms').value):null,
          p_max_users:$('f_users').value?Number($('f_users').value):null, p_max_hotels:Number($('f_hotels').value||1),
          p_sort_order:Number($('f_sort').value||0),
        });
        if(error) throw error;
      }
      flash(isEdit?'Plan mis à jour.':'Plan créé.'); closeDrawer(); renderView();
    }catch(e){ flash(errorLabel(e.message),'e'); }
    finally{ $('dSave').disabled=false; }
  };
}

let billingTab='list', billingPage=0, billingSort={key:'created_at',dir:'desc'};
let billingFilterStatus='', billingFilterHotel='', billingFilterOverdue='';

async function renderBilling(el){
  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Facturation</h1><div class="sub">Facturation de la plateforme Flowtym aux hôtels</div></div></div>

    </div>
    <div id="billingBody"></div>
  </div>`;
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ billingTab=b.dataset.tab; renderBilling(el); });
  const body=$('billingBody');
  if(billingTab==='dashboard') await renderBillingDashboard(body);
  else await renderInvoiceList(body);
}

async function renderInvoiceList(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const [{data:rows,error:iErr},{data:hotels,error:hErr},{data:subs}]=await Promise.all([
    sb.rpc('admin_list_platform_invoices'),
    sb.from('hotels').select('id,name,status,company,address,siret,tva_number,email,billing_email'),
    sb.from('hotel_subscriptions').select('id,hotel_id,plan_id,status'),
  ]);
  if(iErr) throw iErr; if(hErr) throw hErr;
  const hotelById=Object.fromEntries((hotels||[]).map(h=>[h.id,h]));

  let list=rows||[];
  if(searchQuery.trim()){
    const q=searchQuery.trim().toLowerCase();
    list=list.filter(r=>[r.hotel_name,r.number].filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
  }
  if(billingFilterStatus) list=list.filter(r=>r.status===billingFilterStatus);
  if(billingFilterHotel) list=list.filter(r=>r.hotel_id===billingFilterHotel);
  if(billingFilterOverdue==='yes') list=list.filter(r=>isInvoiceOverdue(r));
  list=sortRows(list, billingSort.key, billingSort.dir);

  const pageSize=20, pageCount=Math.max(1,Math.ceil(list.length/pageSize));
  billingPage=Math.min(billingPage,pageCount-1);
  const pageRows=list.slice(billingPage*pageSize,(billingPage+1)*pageSize);

  el.innerHTML=`
    <div class="phead" style="margin-top:14px">
      <div class="sub">${fmtNum(list.length)} facture(s)</div>
      <div class="actions">
        <button class="btn g" id="exportInvoices"><i class="fa-solid fa-download"></i> Exporter CSV</button>
        <button class="btn p" id="newInvoice"><i class="fa-solid fa-plus"></i> Nouvelle facture</button>
      </div>
    </div>
    <div class="filters">
      <select id="fBStatus"><option value="">Tous les statuts</option>${Object.entries(INVOICE_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${billingFilterStatus===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fBHotel"><option value="">Tous les hôtels</option>${(hotels||[]).map(h=>`<option value="${h.id}" ${billingFilterHotel===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select>
      <select id="fBOverdue"><option value="">Échéance : tous</option><option value="yes" ${billingFilterOverdue==='yes'?'selected':''}>En retard uniquement</option></select>
    </div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr>
        <th data-k="hotel_name">Hôtel</th><th>Numéro</th><th data-k="status">Statut</th><th>État financier</th>
        <th data-k="amount_ttc">Montant TTC</th><th>Réglé</th><th>Solde</th>
        <th data-k="due_date">Échéance</th><th data-k="created_at">Créée le</th><th>Actions</th>
      </tr></thead>
      <tbody>${pageRows.length?pageRows.map(rowInvoiceHtml).join(''):`<tr><td colspan="10" class="empty">Aucune facture${searchQuery?' pour cette recherche':''}.</td></tr>`}</tbody>
    </table></div>
    <div class="pager">
      <span>Page ${billingPage+1} / ${pageCount}</span>
      <button id="bPrev" ${billingPage===0?'disabled':''}>‹ Précédent</button>
      <button id="bNext" ${billingPage>=pageCount-1?'disabled':''}>Suivant ›</button>
    </div>
  `;
  el.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    billingSort = billingSort.key===k ? {key:k,dir:billingSort.dir==='asc'?'desc':'asc'} : {key:k,dir:'asc'};
    renderInvoiceList(el);
  });
  $('fBStatus').onchange=e=>{ billingFilterStatus=e.target.value; billingPage=0; renderInvoiceList(el); };
  $('fBHotel').onchange=e=>{ billingFilterHotel=e.target.value; billingPage=0; renderInvoiceList(el); };
  $('fBOverdue').onchange=e=>{ billingFilterOverdue=e.target.value; billingPage=0; renderInvoiceList(el); };
  $('bPrev')&&($('bPrev').onclick=()=>{ billingPage--; renderInvoiceList(el); });
  $('bNext')&&($('bNext').onclick=()=>{ billingPage++; renderInvoiceList(el); });
  $('exportInvoices').onclick=()=>downloadCSV('factures.csv', list, [
    {label:'Hôtel',get:r=>r.hotel_name},{label:'Numéro',get:r=>r.number||'(proforma)'},
    {label:'Statut',get:r=>invoiceStatusBadge(r.status).label},{label:'Montant TTC',get:r=>r.amount_ttc},
    {label:'Réglé',get:r=>r.paid_amount},{label:'Solde',get:r=>r.balance},
    {label:'Échéance',get:r=>fmtDate(r.due_date)},{label:'Créée le',get:r=>fmtDate(r.created_at)},
  ]);
  $('newInvoice').onclick=()=>openCreateInvoiceModal(hotels||[], subs||[], ()=>renderInvoiceList(el));
  el.querySelectorAll('[data-open-inv]').forEach(b=>b.onclick=()=>openInvoiceDrawer(b.dataset.openInv, hotelById, ()=>renderBilling($('view'))));
}

function renderInvoiceDrawerBody(detail, onChange){
  const inv=detail.invoice, hotel=detail.hotel, sub=detail.subscription;
  const payments=detail.payments||[], creditNotes=detail.credit_notes||[], history=detail.history||[];
  const credited=inv.credited_ttc!=null?Number(inv.credited_ttc):creditNotes.filter(c=>c.status==='issued').reduce((s,c)=>s+Number(c.amount_ttc),0);
  const balance=inv.balance!=null?Number(inv.balance):Number(inv.amount_ttc)-Number(inv.paid_amount)-credited;
  const st=invoiceStatusBadge(inv.status);
  const fs=financialStateBadge(inv.financial_state);
  const acts=billingActionsForStatus(inv.status, inv.paid_amount);
  const overdue=inv.financial_state==='overdue';

  openDrawer(`
    <div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button>
      <h2>${esc(hotel.name)} — ${esc(inv.number||'Proforma')}</h2>

    </div>

    <div class="sec"><h4>Détails</h4>
      <div class="kv"><span>Montant HT</span><b>${fmtMoney(inv.amount_ht, inv.currency)}</b></div>
      <div class="kv"><span>TVA (${inv.tva_rate}%)</span><b>${fmtMoney(inv.tva_amount, inv.currency)}</b></div>
      <div class="kv"><span>Montant TTC</span><b>${fmtMoney(inv.amount_ttc, inv.currency)}</b></div>
      <div class="kv"><span>Réglé</span><b>${fmtMoney(inv.paid_amount, inv.currency)}</b></div>
      <div class="kv"><span>Avoirs émis</span><b>${fmtMoney(credited, inv.currency)}</b></div>
      <div class="kv"><span>Solde</span><b>${fmtMoney(balance, inv.currency)}</b></div>
      <div class="kv"><span>Période</span><b>${inv.period_start?fmtDate(inv.period_start)+' → '+fmtDate(inv.period_end):'—'}</b></div>
      <div class="kv"><span>Échéance</span><b>${fmtDate(inv.due_date)}</b></div>
      <div class="kv"><span>Émise le</span><b>${fmtDateTime(inv.issued_at)}</b></div>
      ${sub?`<div class="kv"><span>Abonnement lié</span><b>${esc(sub.id.slice(0,8))}… (${esc(sub.status)})</b></div>`:''}
      ${inv.notes?`<div class="kv"><span>Notes</span><b>${esc(inv.notes)}</b></div>`:''}
      <div class="actrow">
        ${acts.canIssue?'<button class="btn p" id="iIssue"><i class="fa-solid fa-paper-plane"></i> Émettre</button>':''}
        ${acts.canCancel?'<button class="btn d" id="iCancel"><i class="fa-solid fa-ban"></i> Annuler</button>':''}
        <button class="btn g" id="iPrint"><i class="fa-solid fa-print"></i> Imprimer / enregistrer en PDF</button>
      </div>
      ${overdue && sub?`<div class="actrow"><button class="btn d" id="iSuspend"><i class="fa-solid fa-pause"></i> Suspendre l'abonnement pour impayé</button></div>`:''}
    </div>

      <div class="tlist">

  $('iIssue')&&($('iIssue').onclick=()=>confirmAction({
    title:'Émettre la facture', body:'Un numéro définitif sera attribué et les coordonnées de facturation seront figées. Action irréversible.',

    onConfirm: async()=>{ const {error}=await sb.rpc('admin_issue_platform_invoice',{p_invoice_id:inv.id}); if(error) throw error; flash('Facture émise.'); refresh(); }

  $('iCancel')&&($('iCancel').onclick=()=>{
    formModal({
      title:'Annuler la facture', danger:true,
      bodyHtml:'<div class="fld"><label>Motif *</label><textarea id="cx_reason"></textarea></div>',
      confirmLabel:'Annuler la facture',
      onConfirm: async()=>{
        const reason=$('cx_reason').value.trim();

        const {error}=await sb.rpc('admin_cancel_platform_invoice',{p_invoice_id:inv.id,p_reason:reason});

    title:'Suspendre l\'abonnement pour impayé', danger:true,
    body:`L'hôtel ${esc(hotel.name)} perdra l'accès à la plateforme jusqu'à réactivation manuelle. Le motif sera consigné avec la référence de cette facture.`,
    confirmLabel:'Suspendre',
    onConfirm: async()=>{
      const {error}=await sb.rpc('admin_suspend_subscription_for_nonpayment',{p_subscription_id:sub.id,p_invoice_id:inv.id,p_reason:null});
      if(error) throw error;
      flash('Abonnement suspendu pour impayé.'); refresh();
    }
  }));

  $('iRecordPayment')&&($('iRecordPayment').onclick=()=>{
    formModal({
      title:'Enregistrer un paiement',
      bodyHtml:`
        <div class="fld"><label>Montant (€) *</label><input type="number" id="rp_amount" step="0.01" min="0" value="${balance}"></div>
        <div class="fld"><label>Méthode</label><select id="rp_method">${Object.entries(PAYMENT_METHOD_LABEL).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
        <div class="fld"><label>Référence</label><input id="rp_ref"></div>
        <div class="fld"><label>Statut</label><select id="rp_status"><option value="recorded">Enregistré (encaissé)</option><option value="pending">En attente de confirmation</option></select></div>
      `,
      confirmLabel:'Enregistrer',
      onConfirm: async()=>{
        const amount=parseFloat($('rp_amount').value);
        if(!amount || amount<=0) throw new Error('Le montant doit être positif.');
        const {error}=await sb.rpc('admin_record_platform_payment',{
          p_invoice_id:inv.id, p_amount:amount, p_method:$('rp_method').value,
          p_reference:$('rp_ref').value.trim()||null, p_status:$('rp_status').value, p_notes:null,
        });
        if(error) throw error;
        flash('Paiement enregistré.'); refresh();
      }
    });
  });
  document.querySelectorAll('[data-confirm-pay]').forEach(b=>b.onclick=()=>confirmAction({
    title:'Confirmer ce paiement', body:'Le paiement sera marqué comme encaissé.', confirmLabel:'Confirmer',
    onConfirm: async()=>{ const {error}=await sb.rpc('admin_update_platform_payment_status',{p_payment_id:b.dataset.confirmPay,p_status:'recorded'}); if(error) throw error; flash('Paiement confirmé.'); refresh(); }
  }));
  document.querySelectorAll('[data-fail-pay]').forEach(b=>b.onclick=()=>confirmAction({
    title:'Marquer ce paiement en échec', danger:true, body:'Ce paiement ne sera pas comptabilisé.', confirmLabel:'Marquer en échec',
    onConfirm: async()=>{ const {error}=await sb.rpc('admin_update_platform_payment_status',{p_payment_id:b.dataset.failPay,p_status:'failed'}); if(error) throw error; flash('Paiement marqué en échec.'); refresh(); }
  }));
  document.querySelectorAll('[data-reverse-pay]').forEach(b=>b.onclick=()=>{
    formModal({
      title:'Renverser ce paiement', danger:true,
      bodyHtml:'<p style="margin-bottom:10px">Le montant sera retiré du réglé de la facture (chèque rejeté, virement annulé...).</p><div class="fld"><label>Motif *</label><textarea id="rv_pay_reason"></textarea></div>',
      confirmLabel:'Renverser',
      onConfirm: async()=>{
        const reason=$('rv_pay_reason').value.trim();
        if(!reason) throw new Error('Un motif est requis.');
        const {error}=await sb.rpc('admin_reverse_platform_payment',{p_payment_id:b.dataset.reversePay,p_reason:reason});
        if(error) throw error;
        flash('Paiement renversé.'); refresh();
      }
    });
  });

  $('iCreateCreditNote')&&($('iCreateCreditNote').onclick=()=>{
    formModal({
      title:'Émettre un avoir',
      bodyHtml:`
        <div class="row2">
          <div class="fld"><label>Montant HT (€) *</label><input type="number" id="cn_ht" step="0.01" min="0"></div>
          <div class="fld"><label>TVA (€)</label><input type="number" id="cn_tva" step="0.01" min="0" value="0"></div>
        </div>
        <div class="fld"><label>Motif *</label><textarea id="cn_reason"></textarea></div>
      `,
      confirmLabel:'Émettre l\'avoir',
      onConfirm: async()=>{
        const ht=parseFloat($('cn_ht').value); const reason=$('cn_reason').value.trim();
        if(!ht || ht<=0) throw new Error('Le montant HT doit être positif.');
        if(!reason) throw new Error('Un motif est requis.');
        const {error}=await sb.rpc('admin_create_platform_credit_note',{p_invoice_id:inv.id,p_amount_ht:ht,p_tva_amount:parseFloat($('cn_tva').value)||0,p_reason:reason});
        if(error) throw error;
        flash('Avoir émis.'); refresh();
      }
    });
  });
  document.querySelectorAll('[data-void-cn]').forEach(b=>b.onclick=()=>{
    formModal({
      title:'Annuler cet avoir', danger:true,
      bodyHtml:'<div class="fld"><label>Motif *</label><textarea id="vc_reason"></textarea></div>',
      confirmLabel:'Annuler l\'avoir',
      onConfirm: async()=>{
        const reason=$('vc_reason').value.trim();
        if(!reason) throw new Error('Un motif est requis.');
        const {error}=await sb.rpc('admin_void_platform_credit_note',{p_credit_note_id:b.dataset.voidCn,p_reason:reason});
        if(error) throw error;
        flash('Avoir annulé.'); refresh();
      }
    });
  });
}

/* =====================================================================
   Support (Lot 5, PR-06, ADR-012 §3.5) — back-office : liste/filtres/tri,
   détail (fil de réponses append-only), triage (statut/priorité/assignation),
   réponse publique ou note interne, masquage audité. Écriture exclusivement
   via RPC (jamais d'accès table direct depuis ce module).
   ===================================================================== */
const SUPPORT_STATUS_LABEL={nouveau:'Nouveau',en_analyse:'En analyse',attente_utilisateur:"Attente utilisateur",en_correction:'En correction',resolu:'Résolu',ferme:'Fermé'};
const SUPPORT_STATUS_TAG={nouveau:'blue',en_analyse:'amber',attente_utilisateur:'amber',en_correction:'amber',resolu:'green',ferme:'gray'};
const SUPPORT_PRIORITY_LABEL={bloquant:'Bloquant',eleve:'Élevée',moyen:'Moyenne',faible:'Faible'};
const SUPPORT_PRIORITY_TAG={bloquant:'red',eleve:'amber',moyen:'blue',faible:'gray'};
const SUPPORT_RISK_LABEL={critique:'Critique',eleve:'Élevé',moyen:'Moyen',faible:'Faible'};

let supportPage=0, supportSort={key:'created_at',dir:'desc'};
let supportFilterStatus='', supportFilterPriority='', supportFilterModule='', supportFilterRisk='';

async function renderSupport(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const pageSize=20;
  const {data:rows0,error}=await sb.rpc('admin_list_support_tickets',{
    p_status:supportFilterStatus||null, p_priority:supportFilterPriority||null, p_assigned_to:null,
    p_hotel_id:null, p_module:supportFilterModule||null, p_risk_score:supportFilterRisk||null,
    p_search:searchQuery.trim()||null, p_limit:pageSize, p_offset:supportPage*pageSize,
  });
  if(error) throw error;
  const rows=rows0||[];
  const total=rows.length?rows[0].total_count:0;
  const pageCount=Math.max(1,Math.ceil(total/pageSize));
  const modules=[...new Set(rows.map(r=>r.module).filter(Boolean))];

  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Support</h1><div class="sub">Tickets remontés par les hôtels — triage, réponses, notes internes</div></div></div>

    <div class="filters">
      <select id="fSStatus"><option value="">Tous les statuts</option>${Object.entries(SUPPORT_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${supportFilterStatus===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fSPriority"><option value="">Toutes priorités</option>${Object.entries(SUPPORT_PRIORITY_LABEL).map(([k,l])=>`<option value="${k}" ${supportFilterPriority===k?'selected':''}>${l}</option>`).join('')}</select>
      <select id="fSRisk"><option value="">Tous risques</option>${Object.entries(SUPPORT_RISK_LABEL).map(([k,l])=>`<option value="${k}" ${supportFilterRisk===k?'selected':''}>${l}</option>`).join('')}</select>
    </div>

    ${!rows.length?`<div class="stub"><div class="ic"><i class="fa-regular fa-life-ring"></i></div><h2>Aucun ticket</h2>
      <p>Aucun ticket support${supportFilterStatus||supportFilterPriority||supportFilterRisk||searchQuery.trim()?' pour ce filtre':''}.</p>
    </div>`:`
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Hôtel</th><th>Ticket</th><th>Module</th><th>Priorité</th><th>Statut</th><th>Risque</th><th>Assigné à</th><th>Réponses</th><th>Créé le</th></tr></thead>
      <tbody>${rows.map(r=>`
        <tr style="cursor:pointer" data-id="${r.id}">
          <td><b>${esc(r.hotel_name)}</b></td>
          <td>${esc(r.ticket_number||'—')}</td>
          <td>${esc(r.module||'—')}</td>
          <td><span class="tag ${SUPPORT_PRIORITY_TAG[r.priority]||'gray'}">${SUPPORT_PRIORITY_LABEL[r.priority]||esc(r.priority)}</span></td>
          <td><span class="tag ${SUPPORT_STATUS_TAG[r.status]||'gray'}">${SUPPORT_STATUS_LABEL[r.status]||esc(r.status)}</span></td>
          <td>${r.risk_score?esc(SUPPORT_RISK_LABEL[r.risk_score]||r.risk_score):'<span class="muted">—</span>'}</td>
          <td>${r.assigned_to?esc(r.assigned_to):'<span class="muted">Non assigné</span>'}</td>
          <td>${fmtNum(r.reply_count)}</td>
          <td>${fmtDate(r.created_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div class="pager">
      <span>${total} ticket(s) — page ${supportPage+1}/${pageCount}</span>
      <button id="sSupPrev" ${supportPage<=0?'disabled':''}>‹ Précédent</button>
      <button id="sSupNext" ${supportPage>=pageCount-1?'disabled':''}>Suivant ›</button>
    </div>`}
  </div>`;

  $('fSStatus').onchange=e=>{ supportFilterStatus=e.target.value; supportPage=0; renderSupport(el); };
  $('fSPriority').onchange=e=>{ supportFilterPriority=e.target.value; supportPage=0; renderSupport(el); };
  $('fSRisk').onchange=e=>{ supportFilterRisk=e.target.value; supportPage=0; renderSupport(el); };
  if($('sSupPrev')) $('sSupPrev').onclick=()=>{ supportPage--; renderSupport(el); };
  if($('sSupNext')) $('sSupNext').onclick=()=>{ supportPage++; renderSupport(el); };
  el.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openSupportTicketDrawer(tr.dataset.id, el));
}

async function openSupportTicketDrawer(ticketId, listEl){
  openDrawer(`<div class="dh"><button class="close" id="dClose"><i class="fa-solid fa-xmark"></i></button><h2>Chargement…</h2></div>`);
  $('dClose').onclick=closeDrawer;
  const {data,error}=await sb.rpc('admin_get_support_ticket_detail',{p_ticket_id:ticketId});
  if(error){ flash(errorLabel(error.message),'e'); closeDrawer(); return; }
  const t=(data&&data[0]);
  if(!t){ flash('Ticket introuvable.','e'); closeDrawer(); return; }
  renderSupportTicketDrawerBody(t, listEl);
}

            <div class="actrow">
              ${r.hidden_at
                ?`<button class="btn g sm" data-unhide="${r.id}">Démasquer</button>`
                :`<button class="btn g sm" data-hide="${r.id}">Masquer</button>`}
            </div>
          </div>`).join(''):'<div class="empty" style="padding:14px">Aucune réponse pour l\'instant.</div>'}
      </div>
    </div>
    <div class="sec">
      <h4>Répondre</h4>
      <div class="fld"><textarea id="rBody" rows="4" placeholder="Votre réponse…" style="width:100%;resize:vertical"></textarea></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0">
        <input type="checkbox" id="rInternal"> Note interne (jamais visible côté hôtel)
      </label>
      <div class="actrow"><button class="btn p" id="rSend"><i class="fa-solid fa-paper-plane"></i> Envoyer</button></div>
    </div>
  `);
  $('dClose').onclick=closeDrawer;

  $('tSave').onclick=async()=>{
    $('tSave').disabled=true;
    try{
      const {error}=await sb.rpc('admin_update_support_ticket',{
        p_ticket_id:t.id, p_status:$('tStatus').value, p_priority:$('tPriority').value,
        p_assigned_to:$('tAssigned').value.trim()||null,
      });
      if(error) throw error;
      flash('Triage enregistré.');
      openSupportTicketDrawer(t.id, listEl);
      if(listEl) renderSupport(listEl);
    }catch(e){ flash(errorLabel(e.message),'e'); }
    finally{ $('tSave').disabled=false; }
  };

  $('rSend').onclick=async()=>{
    const body=$('rBody').value.trim();
    if(!body){ flash('La réponse ne peut pas être vide.','e'); return; }
    $('rSend').disabled=true;
    try{
      const {error}=await sb.rpc('admin_reply_support_ticket',{
        p_ticket_id:t.id, p_body:body, p_is_internal_note:$('rInternal').checked, p_corrects_reply_id:null,
      });
      if(error) throw error;
      flash('Réponse envoyée.');
      openSupportTicketDrawer(t.id, listEl);
      if(listEl) renderSupport(listEl);
    }catch(e){ flash(errorLabel(e.message),'e'); $('rSend').disabled=false; }
  };

  bindSupportHideButtons(t, listEl);
}

function bindSupportHideButtons(t, listEl){
  document.querySelectorAll('[data-hide]').forEach(btn=>btn.onclick=()=>openHideReplyModal(btn.dataset.hide, t, listEl));
  document.querySelectorAll('[data-unhide]').forEach(btn=>btn.onclick=async()=>{
    btn.disabled=true;
    try{
      const {error}=await sb.rpc('admin_unhide_support_ticket_reply',{p_reply_id:btn.dataset.unhide});
      if(error) throw error;
      flash('Réponse démasquée.');
      openSupportTicketDrawer(t.id, listEl);
    }catch(e){ flash(errorLabel(e.message),'e'); btn.disabled=false; }
  });
}

function openHideReplyModal(replyId, t, listEl){
  $('modal').className='modal';
  $('modal').innerHTML=`<h3>Masquer cette réponse</h3>
    <p class="muted" style="font-size:12.5px">La réponse reste visible côté admin (avec l'historique du masquage) mais disparaît de la vue hôtel. Aucune suppression physique.</p>
    <div class="fld"><label>Motif (obligatoire)</label><textarea id="hReason" rows="3" style="width:100%"></textarea></div>
    <div class="mact"><button class="btn g" id="mCancel">Annuler</button><button class="btn d" id="mOk">Masquer</button></div>`;
  $('modalbg').classList.add('on');
  $('mCancel').onclick=()=>{ $('modalbg').classList.remove('on'); $('modal').className='modal'; };
  $('mOk').onclick=async()=>{
    const reason=$('hReason').value.trim();
    if(!reason){ flash('Le motif est obligatoire.','e'); return; }
    $('mOk').disabled=true;
    try{
      const {error}=await sb.rpc('admin_hide_support_ticket_reply',{p_reply_id:replyId, p_reason:reason});
      if(error) throw error;
      flash('Réponse masquée.');
      $('modalbg').classList.remove('on'); $('modal').className='modal';
      openSupportTicketDrawer(t.id, listEl);
    }catch(e){ flash(errorLabel(e.message),'e'); $('mOk').disabled=false; }
  };
}

/* =====================================================================
   Audit (Lot 5) — filtré, paginé côté serveur, JSON présenté lisiblement
   ===================================================================== */
let auditPage=0, auditPageSize=25, auditTotal=0;
let auditFilterAction='', auditFilterLevel='', auditFilterHotel='', auditFilterGroup='', auditFilterEntity='', auditDateFrom='', auditDateTo='';

async function renderAudit(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const [{data:hotels},{data:groups}]=await Promise.all([
    sb.from('hotels').select('id,name'),
    sb.from('hotel_groups').select('id,name').neq('status','archived'),
  ]);
  const {data:rows,error}=await sb.rpc('admin_list_platform_audit_log',{
    p_search: searchQuery.trim()||null, p_admin_email:null,
    p_hotel_id: auditFilterHotel||null, p_group_id: auditFilterGroup||null,
    p_entity: auditFilterEntity||null, p_action: auditFilterAction||null, p_level: auditFilterLevel||null,
    p_date_from: auditDateFrom?new Date(auditDateFrom).toISOString():null,
    p_date_to: auditDateTo?new Date(auditDateTo+'T23:59:59').toISOString():null,
    p_limit: auditPageSize, p_offset: auditPage*auditPageSize,
  });
  if(error) throw error;
  auditTotal=rows?.[0]?.total_count?Number(rows[0].total_count):0;
  const pageCount=Math.max(1,Math.ceil(auditTotal/auditPageSize));
  const entities=['user','user_hotels','hotel','platform_admin','platform_invoice','platform_setting'];
  const actions=['user.invite','user.grant_hotel','user.revoke_hotel','user.change_role','user.suspend','user.reactivate',
    'platform_admin.grant','platform_admin.revoke','hotel.update','group.attach_hotel','group.detach_hotel',
    'invoice.create_proforma','invoice.issue','invoice.cancel','payment.record','payment.update_status','payment.reverse',
    'credit_note.create','credit_note.void','setting.update'];

  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Audit</h1><div class="sub">Journal des actions Super Admin — immuable, ${fmtNum(auditTotal)} événement(s)</div></div>
      <div class="actions"><button class="btn g" id="exportAudit"><i class="fa-solid fa-download"></i> Exporter CSV (page)</button></div>
    </div>
    <div class="filters">
      <input type="date" id="fDateFrom" value="${esc(auditDateFrom)}" title="Depuis">
      <input type="date" id="fDateTo" value="${esc(auditDateTo)}" title="Jusqu'à">
      <select id="fHotel"><option value="">Tous les hôtels</option>${(hotels||[]).map(h=>`<option value="${h.id}" ${auditFilterHotel===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select>
      <select id="fGroup"><option value="">Tous les groupes</option>${(groups||[]).map(g=>`<option value="${g.id}" ${auditFilterGroup===g.id?'selected':''}>${esc(groupNameOr(g.name))}</option>`).join('')}</select>
      <select id="fEntity"><option value="">Tous les objets</option>${entities.map(e=>`<option value="${e}" ${auditFilterEntity===e?'selected':''}>${esc(e)}</option>`).join('')}</select>
      <select id="fAction"><option value="">Toutes les actions</option>${actions.map(a=>`<option value="${a}" ${auditFilterAction===a?'selected':''}>${esc(historyActionLabel(a))}</option>`).join('')}</select>
      <select id="fLevel"><option value="">Tous niveaux</option><option value="info" ${auditFilterLevel==='info'?'selected':''}>Info</option><option value="warn" ${auditFilterLevel==='warn'?'selected':''}>Avertissement</option><option value="error" ${auditFilterLevel==='error'?'selected':''}>Échec</option></select>
    </div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Objet</th><th>Hôtel</th><th>Groupe</th><th>Niveau</th><th>Détails</th></tr></thead>
      <tbody>${rows?.length?rows.map(r=>`
        <tr>
          <td class="muted">${fmtDateTime(r.created_at)}</td>
          <td>${esc(r.admin_email||'—')}</td>
          <td><b>${esc(historyActionLabel(r.action))}</b></td>
          <td>${esc(r.entity||'—')}</td>
          <td>${esc(r.hotel_name||'—')}</td>
          <td>${esc(r.group_name?groupNameOr(r.group_name):'—')}</td>
          <td><span class="tag ${r.level==='error'?'red':r.level==='warn'?'amber':'gray'}">${esc(r.level)}</span></td>
          <td><button data-payload="${r.id}" title="Voir le détail"><i class="fa-regular fa-eye"></i></button></td>
        </tr>`).join(''):'<tr><td colspan="8" class="empty">Aucun événement pour ces filtres.</td></tr>'}</tbody>
    </table></div>
    <div class="pager">
      <span>Page ${auditPage+1} / ${pageCount} (${fmtNum(auditTotal)} au total)</span>
      <button id="aPrev" ${auditPage===0?'disabled':''}>‹ Précédent</button>
      <button id="aNext" ${auditPage>=pageCount-1?'disabled':''}>Suivant ›</button>
    </div>
  </div>`;
  $('fDateFrom').onchange=e=>{ auditDateFrom=e.target.value; auditPage=0; renderAudit(el); };
  $('fDateTo').onchange=e=>{ auditDateTo=e.target.value; auditPage=0; renderAudit(el); };
  $('fHotel').onchange=e=>{ auditFilterHotel=e.target.value; auditPage=0; renderAudit(el); };
  $('fGroup').onchange=e=>{ auditFilterGroup=e.target.value; auditPage=0; renderAudit(el); };
  $('fEntity').onchange=e=>{ auditFilterEntity=e.target.value; auditPage=0; renderAudit(el); };
  $('fAction').onchange=e=>{ auditFilterAction=e.target.value; auditPage=0; renderAudit(el); };
  $('fLevel').onchange=e=>{ auditFilterLevel=e.target.value; auditPage=0; renderAudit(el); };
  $('aPrev').onclick=()=>{ auditPage--; renderAudit(el); };
  $('aNext').onclick=()=>{ auditPage++; renderAudit(el); };
  $('exportAudit').onclick=()=>downloadCSV('audit.csv', rows||[], [
    {label:'Date',get:r=>fmtDateTime(r.created_at)},{label:'Admin',get:r=>r.admin_email},{label:'Action',get:r=>historyActionLabel(r.action)},
    {label:'Objet',get:r=>r.entity},{label:'Hôtel',get:r=>r.hotel_name},{label:'Groupe',get:r=>r.group_name},{label:'Niveau',get:r=>r.level},
  ]);
  el.querySelectorAll('[data-payload]').forEach(b=>b.onclick=()=>{
    const row=(rows||[]).find(r=>r.id===b.dataset.payload);
    const entries=Object.entries(row.payload||{});
    $('modal').innerHTML=`<h3>${esc(historyActionLabel(row.action))}</h3>
      <div class="kv"><span>Date</span><b>${fmtDateTime(row.created_at)}</b></div>
      <div class="kv"><span>Administrateur</span><b>${esc(row.admin_email||'—')}</b></div>
      ${row.ip_address?`<div class="kv"><span>Adresse IP</span><b>${esc(row.ip_address)}</b></div>`:''}
      ${entries.length?`<h4 style="margin:14px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted)">Détails</h4>${entries.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(formatPayloadValue(v))}</b></div>`).join('')}`:''}
      <details style="margin-top:12px"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Voir le JSON brut</summary>
        <pre style="background:#fafafe;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;white-space:pre-wrap;max-height:280px;overflow:auto;margin-top:8px">${esc(JSON.stringify(row.payload||{},null,2))}</pre>
      </details>
      <div class="mact"><button class="btn g" id="mCancel">Fermer</button></div>`;
    $('modalbg').classList.add('on');
    $('mCancel').onclick=()=>$('modalbg').classList.remove('on');
  });
}

/* =====================================================================
   Paramètres plateforme (Lot 5) — les 16 clés existantes uniquement
   ===================================================================== */
const SETTING_CATEGORY={
  platform_name:'Identité', support_email:'Identité', terms_url:'Identité',
  default_currency:'Configuration', default_billing_cycle:'Configuration', default_commitment:'Configuration',
  default_tva_rate:'Configuration', billing_email:'Configuration',
  trial_duration_days:'Essais', max_trial_days:'Essais', min_trial_days:'Essais', max_trial_extensions:'Essais',
  dunning_days_before:'Relances', churn_alert_rate:'Objectifs', mrr_target:'Objectifs', arr_target:'Objectifs',
};
const SETTING_LABEL_FR={
  platform_name:'Nom de la plateforme', support_email:'E-mail de support', terms_url:'CGU/CGV (URL)',
  default_currency:'Devise par défaut', default_billing_cycle:'Cycle de facturation par défaut',
  default_commitment:'Engagement par défaut', default_tva_rate:'Taux de TVA par défaut', billing_email:'E-mail de facturation',
  trial_duration_days:"Durée d'essai (jours)", max_trial_days:"Durée d'essai maximale (jours)",
  min_trial_days:"Durée d'essai minimale (jours)", max_trial_extensions:"Nombre maximal de prolongations d'essai",
  dunning_days_before:'Jours de relance avant échéance', churn_alert_rate:"Seuil d'alerte de résiliation",
  mrr_target:'Objectif de revenu mensuel récurrent (MRR)', arr_target:'Objectif de revenu annuel récurrent (ARR)',
};
function settingLabel(key){ return SETTING_LABEL_FR[key] || key.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }

async function renderSettings(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const {data,error}=await sb.from('platform_settings').select('*').order('key');
  if(error) throw error;
  const byCategory={};
  (data||[]).forEach(s=>{ const cat=SETTING_CATEGORY[s.key]||'Autres'; (byCategory[cat]=byCategory[cat]||[]).push(s); });

  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Paramètres plateforme</h1><div class="sub">${fmtNum((data||[]).length)} paramètre(s) — toute modification est validée, auditée et réservée au Super Admin</div></div></div>
    ${Object.entries(byCategory).map(([cat,settings])=>`
      <div class="box" style="margin-bottom:16px">
        <h3><i class="fa-solid fa-gear"></i> ${esc(cat)}</h3>
        <div class="tlist">
          ${settings.map(s=>`<div class="it">
            <div><div class="nm">${esc(settingLabel(s.key))}</div><div class="sub">${esc(s.description||'')}</div></div>
            <div class="right" style="display:flex;align-items:center;gap:10px">
              <span>${esc(typeof s.value==='object'?JSON.stringify(s.value):String(s.value))}</span>
              <button class="btn sm g" data-edit-setting="${esc(s.key)}">Modifier</button>
            </div>
          </div>`).join('')}
        </div>
      </div>
    `).join('')}
  </div>`;

  el.querySelectorAll('[data-edit-setting]').forEach(b=>b.onclick=()=>{
    const setting=(data||[]).find(s=>s.key===b.dataset.editSetting);
    const type=settingValueType(setting.key);
    const currentDisplay=type==='array'?(setting.value||[]).join(', '):(typeof setting.value==='string'?setting.value:setting.value);
    formModal({
      title:`Modifier « ${settingLabel(setting.key)} »`,
      bodyHtml:`
        <p class="muted" style="font-size:12.5px;margin-bottom:10px">${esc(setting.description||'')}</p>
        <div class="fld"><label>Nouvelle valeur${type==='array'?' (nombres séparés par des virgules)':''}</label><input id="sv_value" value="${esc(currentDisplay)}"></div>
        <div class="fld"><label>Motif (optionnel)</label><input id="sv_reason" placeholder="Consigné dans l'audit"></div>
        <div class="err" id="sv_err"></div>
      `,
      confirmLabel:'Enregistrer',
      onConfirm: async()=>{
        const raw=$('sv_value').value;
        const validation=validateSettingValue(setting.key, raw);
        if(!validation.valid){ throw new Error(validation.error); }
        const {error}=await sb.rpc('admin_update_platform_setting',{p_key:setting.key,p_value:JSON.stringify(validation.value),p_reason:$('sv_reason').value.trim()||null});
        if(error) throw error;
        flash('Paramètre mis à jour.'); renderSettings(el);
      }
    });
  });
}

/* =====================================================================
   Supervision (Lot 5) — honnête : "Non supervisé" plutôt qu'un faux badge vert
   ===================================================================== */
async function renderSupervision(el){
  el.innerHTML='<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Chargement…</div>';
  const {data:s,error}=await sb.rpc('admin_supervision_status');
  if(error) throw error;
  const notSupervised=()=>'<span class="tag gray">Non supervisé</span>';
  el.innerHTML=`<div class="page">
    <div class="phead"><div><h1>Supervision</h1><div class="sub">État technique de la plateforme — uniquement ce qui est réellement mesurable aujourd'hui</div></div></div>
    <div class="cols2">
      <div class="box"><h3><i class="fa-solid fa-database"></i> Base de données</h3>
        <div class="tlist">
          <div class="it"><div class="nm">Connexion</div><div class="right">${s.database_connected?'<span class="tag green">Connectée</span>':notSupervised()}</div></div>
          <div class="it"><div class="nm">Dernière migration appliquée</div><div class="right"><b>${esc(s.last_migration_name||'—')}</b></div></div>
          <div class="it"><div class="nm">Appliquée le</div><div class="right">${fmtDateTime(s.last_migration_at)}</div></div>
        </div>
      </div>
      <div class="box"><h3><i class="fa-solid fa-code-branch"></i> Déploiement</h3>
        <div class="tlist">
          <div class="it"><div class="nm">Version frontend</div><div class="right"><b>Lot 5 — RC1 (stabilisation)</b></div></div>
          <div class="it"><div class="nm">Tâches planifiées (cron)</div><div class="right">${s.scheduled_tasks_known?`<span class="tag gray">${fmtNum(s.scheduled_tasks_count)}</span>`:notSupervised()}</div></div>
          <div class="it"><div class="nm">Webhooks configurés</div><div class="right">${s.webhooks_configured?'<span class="tag green">Oui</span>':'<span class="tag gray">Aucun à ce jour</span>'}</div></div>
        </div>
      </div>
    </div>
    <div class="box" style="margin-top:16px"><h3><i class="fa-solid fa-triangle-exclamation"></i> Signaux non encore instrumentés</h3>
      <div class="tlist">
        <div class="it"><div class="nm">Erreurs de mutation (RPC)</div><div class="right">${s.mutation_error_monitoring_available?'':notSupervised()}</div></div>
        <div class="it"><div class="nm">Erreurs Edge Functions</div><div class="right">${s.edge_function_error_monitoring_available?'':notSupervised()}</div></div>
      </div>
      <p class="muted" style="font-size:12px;margin-top:10px">Ces deux signaux nécessitent une instrumentation dédiée (journalisation systématique des échecs) non construite à ce jour — dette documentée dans le dossier RC1, jamais simulée ici par un faux badge vert.</p>
    </div>
  </div>`;
}

boot();
</script>
