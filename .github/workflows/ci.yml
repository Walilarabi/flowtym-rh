name: CI

# Gate de fusion : une PR ne doit pas être fusionnable si un job échoue.
# (Activer la protection de branche sur `main` : exiger frontend-syntax + db-tests.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-syntax:
    name: Front — syntaxe & code de debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/ci/check-frontend-syntax.mjs

  db-tests:
    name: DB — reconstruction dépôt + tests (P0 24/24 ; concurrence A-G)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Reconstruction depuis le dépôt + suites de tests
        run: bash scripts/ci/run-db-tests.sh
