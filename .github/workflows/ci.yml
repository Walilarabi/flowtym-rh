name: CI

# Gate de fusion : une PR ne doit pas être fusionnable si un job échoue.
# (Activer la protection de branche sur `main` : exiger frontend-syntax + db-tests.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-syntax:
    name: Front — syntaxe & code de debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/ci/check-frontend-syntax.mjs

  db-rls-coverage:
    # Audit Security Advisor 2026-08-05 (rls_disabled_in_public / policy_exists_rls_disabled) :
    # 29 tables production avaient RLS activée uniquement hors migration versionnée (SQL éditeur/
    # dashboard), jamais capturée dans sql/*.sql — invisible à toute reconstruction depuis le dépôt.
    # Échoue si une NOUVELLE table public créée dans sql/*.sql n'a pas son propre
    # ENABLE ROW LEVEL SECURITY dans sql/*.sql (dette pré-existante en baseline, non bloquante).
    name: DB — garde-fou RLS (table public sans RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/ci/check-rls-coverage.mjs

  qa-target-guard-test:
    name: QA — garde-fou cible phase2-staging (non-régression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/qa/tests/test-target-guard.sh

  db-tests:
    name: DB — reconstruction dépôt + tests (P0 24/24 ; concurrence A-G)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Reconstruction depuis le dépôt + suites de tests
        run: bash scripts/ci/run-db-tests.sh

  db-tenant-isolation-tests:
    # P0 sécurité 2026-08-03 — cf. sql/97_security_group_planning_isolation.sql. Reconstruit la
    # base pilote et rejoue sql/tests/tenant_isolation_group_planning.sql : échoue si une seule
    # requête renvoie une donnée d'un groupe hôtelier à un principal d'un autre groupe.
    name: DB — isolation inter-groupes (Planning Groupe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Reconstruction depuis le dépôt + suite d'isolation inter-groupes
        run: bash scripts/ci/run-tenant-isolation-tests.sh

  db-pointage-tests:
    # Applique réellement les migrations 62 + 63 sur une base propre, vérifie
    # leur idempotence, puis exécute les suites de tests SQL du module
    # Pointage (assertions, signatures, RLS, grants, concurrence).
    # Le job db-tests ci-dessus ne charge que le scope pilote (54-56) et ne
    # couvre PAS ces migrations : celui-ci est le garde-fou correspondant.
    name: DB — pointage terminals + hardening
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Appliquer 62 + 63 + exécuter les tests pointage
        run: bash scripts/ci/run-pointage-tests.sh
